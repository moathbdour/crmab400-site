<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="t d">
<title id="t">Cedar Dispatch MCP server C-56: callers, identities and layers</title>
<desc id="d">Four callers on the left. First, the Foundry Dispatch Advisor version 3, which calls with its agent identity holding the app role Dispatch.Read; its host approves Dataverse calls by policy and runs the guard on the mcp_call outputs. Second, a Copilot Studio agent through the custom connector Cedar Dispatch MCP in the CedarConnectors solution, with a delegated token carrying the scope Dispatch.Read for the signed-in user. Third, a Microsoft 365 Copilot declarative agent for coordinators, a pilot, which signs the user in and renders the candidates card. Fourth, Karim's VS Code or the MCP Inspector, which reach only the local server started with --local. In the middle, the Azure Container App ca-cedar-mcp-dev with four layers: built-in authentication validates the Microsoft Entra token for api://cedar-dispatch-mcp and returns 401 without one; the RequirePermission middleware reads X-MS-CLIENT-PRINCIPAL and returns 403 without Dispatch.Read; the MCP server cedar-dispatch 1.0.0 serves POST /mcp statelessly with two read-only tools, rank_candidates bound to the candidates card, and get_subcontractor_profile, and one ui resource; the lesson 99 advisor tools and ranking run on the reviewed facts snapshot. Each tool call writes one audit line to Log Analytics. On the right, the Dataverse MCP server of Cedar-Dev, used only by the advisor in Cedar-Dev, with the signed-in user's identity, two allowed tools describe and read_query, and every call approved by the host.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:14px;fill:#1b1b1b}.h{font-weight:700;font-size:17px}.b{font-weight:700;font-size:15px}.s{font-size:13px}.box{stroke:#1b1b1b;stroke-width:1.5}.ln{stroke:#1b1b1b;stroke-width:1.5;fill:none}.dash{stroke:#1b1b1b;stroke-width:1.5;fill:none;stroke-dasharray:6 4}</style>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1b1b1b"/></marker></defs>
<rect width="1000" height="720" fill="#ffffff"/>
<text class="h" x="20" y="30">Cedar Dispatch MCP server (C-56): one implementation, several clients</text>

