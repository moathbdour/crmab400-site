<text class="s" x="366" y="322">POST /mcp, stateless, JSON responses</text>
<text class="s" x="366" y="344">tool rank_candidates (read-only)</text>
<text class="s" x="380" y="362">→ _meta.ui: candidates card</text>
<text class="s" x="366" y="382">tool get_subcontractor_profile (read-only)</text>
<text class="s" x="366" y="402">resource ui://cedar-dispatch/candidates-card.html</text>
<text class="s" x="366" y="418">(text/html;profile=mcp-app, CSP: jsdelivr)</text>
<line class="ln" x1="530" y1="426" x2="530" y2="444" marker-end="url(#a)"/>
<rect class="box" x="354" y="444" width="352" height="72" rx="6" fill="#ffffff"/>
<text class="b" x="366" y="466">4 Advisor tools and ranking (lesson 99)</text>
<text class="s" x="366" y="486">normalise, validate, rank: bands only;</text>
<text class="s" x="366" y="504">facts snapshot advisor-facts.json (reviewed)</text>
<text class="s" x="354" y="546">Each call: one audit line {tool, result, number,</text>
<text class="s" x="354" y="564">caller, callerKind} → Log Analytics</text>

<rect class="box" x="740" y="74" width="240" height="160" rx="8" fill="#dff6dd"/>
<text class="b" x="752" y="96">Dataverse MCP server</text>
<text class="s" x="752" y="116">Cedar-Dev only, advisor v3</text>
<text class="s" x="752" y="136">identity: the signed-in user</text>
<text class="s" x="752" y="154">(OAuth passthrough, allowed</text>
<text class="s" x="752" y="172">client "Cedar Foundry Dataverse</text>
<text class="s" x="752" y="190">MCP"); allowed_tools: describe,</text>
<text class="s" x="752" y="208">read_query; host approves each</text>
<text class="s" x="752" y="226">call</text>
<path class="dash" d="M290,84 C330,38 690,38 738,96" marker-end="url(#a)"/>

<rect class="box" x="740" y="260" width="240" height="166" rx="8" fill="#ffffff"/>
<text class="b" x="752" y="282">Not on this server</text>
<text class="s" x="752" y="302">no write tool: dispatch stays in</text>
<text class="s" x="752" y="320">the app (AU-08)</text>
<text class="s" x="752" y="342">no figures: bands only</text>
<text class="s" x="752" y="364">no API keys: every call</text>
<text class="s" x="752" y="382">has a person or an agent</text>
<text class="s" x="752" y="400">identity behind it</text>

<rect class="box" x="20" y="600" width="960" height="100" rx="8" fill="#fff4ce"/>
<text class="b" x="34" y="624">Release rules</text>
<text class="s" x="34" y="646">Pull request: 25 Python tests (server in memory, HTTP with principals, advisor v3) and the surface check MCP-R1…R7; connector check CONN-19.</text>
<text class="s" x="34" y="666">A new server version changes what Copilot Studio agents see at once: version the image, test in Cedar-Dev, then Cedar-Test.</text>
<text class="s" x="34" y="686">The advisor pins its evaluated version; a new tool surface means a new advisor version and a new evaluation run.</text>
</svg>
