<text class="b" x="32" y="96">Dispatch Advisor v3 (Foundry)</text>
<text class="s" x="32" y="116">agent identity, app role Dispatch.Read</text>
<text class="s" x="32" y="134">host: approves Dataverse reads by</text>
<text class="s" x="32" y="152">policy, guard reads mcp_call outputs</text>
<text class="s" x="32" y="170">require_approval never for C-56</text>
<rect class="box" x="20" y="196" width="270" height="92" rx="8" fill="#dbe9f6"/>
<text class="b" x="32" y="218">Copilot Studio agent</text>
<text class="s" x="32" y="238">custom connector Cedar Dispatch MCP</text>
<text class="s" x="32" y="256">(CedarConnectors), delegated token:</text>
<text class="s" x="32" y="274">user + scope Dispatch.Read</text>
<rect class="box" x="20" y="300" width="270" height="92" rx="8" fill="#dbe9f6"/>
<text class="b" x="32" y="322">Microsoft 365 Copilot (pilot)</text>
<text class="s" x="32" y="342">declarative agent Cedar Dispatch;</text>
<text class="s" x="32" y="360">user signs in; renders the</text>
<text class="s" x="32" y="378">candidates card (XP-10)</text>
<rect class="box" x="20" y="404" width="270" height="74" rx="8" fill="#f3f2f1"/>
<text class="b" x="32" y="426">Karim: VS Code, MCP Inspector</text>
<text class="s" x="32" y="446">local server only (--local,</text>
<text class="s" x="32" y="464">127.0.0.1, fixed developer caller)</text>

<line class="ln" x1="290" y1="130" x2="338" y2="200" marker-end="url(#a)"/>
<line class="ln" x1="290" y1="242" x2="338" y2="242" marker-end="url(#a)"/>
<line class="ln" x1="290" y1="346" x2="338" y2="282" marker-end="url(#a)"/>

<rect class="box" x="340" y="60" width="380" height="520" rx="10" fill="#f3f2f1"/>
<text class="b" x="354" y="84">Azure Container App ca-cedar-mcp-dev</text>
<rect class="box" x="354" y="100" width="352" height="72" rx="6" fill="#fde7e9"/>
<text class="b" x="366" y="122">1 Built-in authentication</text>
<text class="s" x="366" y="142">validates the Entra token, audience</text>
<text class="s" x="366" y="160">api://cedar-dispatch-mcp; no token → 401</text>
<line class="ln" x1="530" y1="172" x2="530" y2="190" marker-end="url(#a)"/>
