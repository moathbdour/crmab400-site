<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Segoe UI, Arial, sans-serif" font-size="15">
<title>Flow, connection reference, connection and connector per environment</title>
<rect width="880" height="420" fill="#ffffff"/>
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="20" y="30" font-size="18" font-weight="bold" fill="#111">Same solution, different connection in each environment</text>
<rect x="20" y="60" width="200" height="90" rx="8" fill="#e8f0fb" stroke="#2b5797"/>
<text x="35" y="88" font-weight="bold" fill="#111">Cloud flow</text>
<text x="35" y="112" fill="#111">Cedar – Notify urgent</text>
<text x="35" y="134" fill="#111">case (in solution)</text>
<rect x="260" y="60" width="260" height="90" rx="8" fill="#e8f0fb" stroke="#2b5797"/>
<text x="275" y="88" font-weight="bold" fill="#111">Connection reference</text>
<text x="275" y="112" fill="#111">cedar_OutlookNotifications</text>
<text x="275" y="134" fill="#111">connector: Office 365 Outlook</text>
<text x="35" y="178" fill="#555">Both ship in CedarServiceCore (managed downstream)</text>
<line x1="220" y1="105" x2="258" y2="105" stroke="#333" stroke-width="2" marker-end="url(#b)"/>
<rect x="560" y="50" width="300" height="70" rx="8" fill="#eaf6ea" stroke="#2e7d32"/>
<text x="575" y="78" font-weight="bold" fill="#111">Cedar-Dev connection</text>
<text x="575" y="102" fill="#111">signed in as Karim (maker)</text>
<rect x="560" y="140" width="300" height="70" rx="8" fill="#eaf6ea" stroke="#2e7d32"/>
<text x="575" y="168" font-weight="bold" fill="#111">Cedar-Test connection</text>
<text x="575" y="192" fill="#111">svc-cedar-test mailbox</text>
<rect x="560" y="230" width="300" height="70" rx="8" fill="#eaf6ea" stroke="#2e7d32"/>
<text x="575" y="258" font-weight="bold" fill="#111">Cedar-Prod connection</text>
<text x="575" y="282" fill="#111">svc-cedar-prod mailbox</text>
<line x1="520" y1="95" x2="558" y2="85" stroke="#333" stroke-width="2" marker-end="url(#b)"/>
<line x1="520" y1="115" x2="558" y2="170" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
<line x1="520" y1="135" x2="558" y2="260" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
<text x="20" y="250" font-weight="bold" fill="#111">Connection = stored credential,</text>
<text x="20" y="272" fill="#111">never in a solution, created per</text>
<text x="20" y="294" fill="#111">environment and bound at import</text>
<text x="20" y="316" fill="#111">(ConnectionId in the settings file).</text>
<text x="20" y="370" fill="#111">Dashed arrows: bindings chosen at import time. The flow turns on only if the person (or service</text>
<text x="20" y="392" fill="#111">principal) turning it on owns or has "Can use" on every connection it references.</text>
</svg>
