<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-labelledby="t d">
  <title id="t">Which practice form tests each AB-400 objective</title>
  <desc id="d">Grid of the 88 AB-400 objectives in four rows by domain, each cell labelled with its number. Build Microsoft Power Platform solutions: both forms B-13, B-17; PA2 only B-01, B-03, B-06, B-07, B-09, B-10, B-11, B-12, B-14, B-15, B-16, B-19, B-20, B-22. Extend the user experience: both forms U-02, U-15, U-18; PA2 only U-08, U-09, U-11, U-13, U-14, U-16, U-17, U-19, U-20, U-21. Extend Microsoft Power Platform: both forms E-15, E-17, E-26; PA2 only E-02, E-03, E-05, E-06, E-08, E-09, E-13, E-18, E-20, E-21, E-23, E-25, E-27, E-29. Develop integrations: both forms I-13; PA2 only I-01, I-02, I-08, I-10, I-11, I-12, I-14. All other objectives are tested by PA1 only. Together the two forms test all 88.</desc>
