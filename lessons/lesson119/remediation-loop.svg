<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="t d">
  <title id="t">C-79 remediation loop: from PA1 to labs to PA2</title>
  <desc id="d">Karim's PA1 result (81% of points, 9 items missed, ready check failed on pace) goes into C-79 diagnose: 6 misses explained by a confused pair, 3 by the wrong-detail habit, plus 4 findings (pace, Learn budget, second-guessing, Build calibration), 21 targets in all. planRemediation picks 9 labs worth 275 of 300 minutes. Wednesday 9 December: R1 pace 30 minutes, R8 automation host 20, R5 lookup filters and CSP 35, R7 code app flows and connector metadata 35, R3 identity gates 30. Thursday 10 December: R4 alert latency 30, R6 long-running calls 25, R2 bulk writes 35, R9 calibration 35. Card sessions on 8, 9 and 10 December review 39, 45 and 19 cards; B-10, B-16 and B-20 are not recalled and the CSP contrast card is missed again. Calibration lowers Build readiness from 91 to 84%. PA2 on Friday 11 December has 48 new items covering the 45 objectives PA1 left and re-testing the 9 missed ones. compareForms: points 81 to 87%, last checkpoint +3 to −1 minutes, Learn 9 to 2 minutes, 8 of 9 re-tested objectives fixed (89%, U-18 still wrong), ready check passes. Lesson 120 starts from the remaining weak spots: Integrations 75% against 89% readiness and 19 cards below box 4.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <style>
    text { font-family: Segoe UI, Arial, sans-serif; fill: #1f2937; }
    .h { font-size: 16px; font-weight: 700; }
    .c { font-size: 14px; }
  </style>
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" class="h" style="font-size:20px">C-79: diagnose, remediate, re-test</text>

  <rect x="20" y="50" width="290" height="160" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="32" y="74" class="h">PA1 result, Tue 8 Dec</text>
  <text x="32" y="98" class="c">39/48 points (81%)</text>
  <text x="32" y="120" class="c">9 items missed, 3 confident</text>
  <text x="32" y="142" class="c">+3 min at the last checkpoint</text>
  <text x="32" y="164" class="c">Learn 9 min (budget 6)</text>
  <text x="32" y="186" class="c">Build 78% vs readiness 89%</text>

  <rect x="355" y="50" width="290" height="160" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="367" y="74" class="h">diagnose()</text>
  <text x="367" y="98" class="c">confused pair: 6 misses</text>
  <text x="367" y="120" class="c">habit (wrong detail): 3 misses</text>
  <text x="367" y="142" class="c">findings: pace, Learn budget,</text>
  <text x="367" y="164" class="c">second-guessing, calibration</text>
  <text x="367" y="186" class="c">21 targets, weighted</text>

  <rect x="690" y="50" width="290" height="160" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="702" y="74" class="h">planRemediation()</text>
  <text x="702" y="98" class="c">greedy: weight per minute</text>
  <text x="702" y="120" class="c">9 labs, 275 of 300 minutes</text>
  <text x="702" y="142" class="c">first day with room, no split</text>
  <text x="702" y="164" class="c">0 uncovered, 0 overflow</text>
  <text x="702" y="186" class="c">re-test list: 9 objectives</text>

  <line x1="310" y1="130" x2="351" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="645" y1="130" x2="686" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="835" y1="210" x2="835" y2="246" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <rect x="20" y="250" width="960" height="170" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="32" y="274" class="h">Wed 9 Dec (150 min)</text>
  <text x="32" y="298" class="c">R1 pace, Learn, changes 30</text>
  <text x="32" y="320" class="c">R8 automation host 20</text>
  <text x="32" y="342" class="c">R5 lookup filters + CSP 35</text>
  <text x="32" y="364" class="c">R7 code app flows + metadata 35</text>
  <text x="32" y="386" class="c">R3 identity gates 30</text>
  <text x="352" y="274" class="h">Thu 10 Dec (125 min)</text>
  <text x="352" y="298" class="c">R4 alert latency 30</text>
  <text x="352" y="320" class="c">R6 long-running calls 25</text>
  <text x="352" y="342" class="c">R2 bulk writes 35</text>
  <text x="352" y="364" class="c">R9 calibration 35:</text>
  <text x="352" y="386" class="c">Build readiness 91% → 84%</text>
  <text x="672" y="274" class="h">Card sessions (C-76)</text>
  <text x="672" y="298" class="c">8 Dec: 39 due, all right</text>
  <text x="672" y="320" class="c">9 Dec: 45 due; B-10, B-16,</text>
  <text x="672" y="342" class="c">B-20 not recalled</text>
  <text x="672" y="364" class="c">10 Dec: 19 due; CSP contrast</text>
  <text x="672" y="386" class="c">card wrong again</text>
  <text x="500" y="410" text-anchor="middle" class="c" style="font-style:italic">Labs teach; only the next form measures. No rating is raised from a lab.</text>

  <line x1="500" y1="420" x2="500" y2="456" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <rect x="20" y="460" width="290" height="180" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="32" y="484" class="h">PA2, Fri 11 Dec</text>
  <text x="32" y="508" class="c">48 new items, 100 minutes</text>
  <text x="32" y="530" class="c">45 objectives PA1 left out</text>
  <text x="32" y="552" class="c">+ 9 missed ones re-tested</text>
  <text x="32" y="574" class="c">checkNextForm: 88 of 88</text>
  <text x="32" y="596" class="c">46/53 points (87%)</text>
  <text x="32" y="618" class="c">−1 min at the last checkpoint</text>

  <rect x="355" y="460" width="290" height="180" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="367" y="484" class="h">compareForms()</text>
  <text x="367" y="508" class="c">points 81% → 87%</text>
  <text x="367" y="530" class="c">Learn 9 → 2 min</text>
  <text x="367" y="552" class="c">transfer 89% (8 of 9 fixed;</text>
  <text x="367" y="574" class="c">U-18 still wrong)</text>
  <text x="367" y="596" class="c">ready check: pass</text>
  <text x="367" y="618" class="c">verdict: keep the date</text>

  <rect x="690" y="460" width="290" height="180" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="702" y="484" class="h">Into lesson 120</text>
  <text x="702" y="508" class="c">Integrations 75% vs 89%:</text>
  <text x="702" y="530" class="c">ratings optimistic again</text>
  <text x="702" y="552" class="c">10 cards back to box 1</text>
  <text x="702" y="574" class="c">19 cards can't reach box 4</text>
  <text x="702" y="596" class="c">by Tue 15 Dec</text>
  <text x="702" y="618" class="c">→ final revision plan</text>

  <line x1="310" y1="550" x2="351" y2="550" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="645" y1="550" x2="686" y2="550" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
</svg>
