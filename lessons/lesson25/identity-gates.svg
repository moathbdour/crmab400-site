<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">Four gates between Omar and a Cedar case</title>
<desc id="d">Omar signs in to Microsoft Entra ID (authentication), Entra issues a token, Dataverse checks environment access (license, enabled user, environment security group), then authorization via security roles, business unit, teams and sharing decides which rows and operations he gets.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#1b2733}.h{font-weight:700;font-size:16px}.s{font-size:14px;fill:#3b4a58}rect{stroke:#2d5b7a;stroke-width:2;rx:10}</style>
<rect x="0" y="0" width="960" height="420" fill="#ffffff" stroke="none"/>
<rect x="20" y="140" width="150" height="110" fill="#eef4f8"/><text x="95" y="180" text-anchor="middle" class="h">Omar Saleh</text><text x="95" y="205" text-anchor="middle" class="s">browser, Cedar</text><text x="95" y="225" text-anchor="middle" class="s">Operations app</text>
<rect x="215" y="120" width="175" height="150" fill="#e3f0e6"/><text x="302" y="148" text-anchor="middle" class="h">1 Authentication</text><text x="302" y="175" text-anchor="middle" class="s">Microsoft Entra ID</text><text x="302" y="197" text-anchor="middle" class="s">password + MFA,</text><text x="302" y="217" text-anchor="middle" class="s">Conditional Access</text><text x="302" y="245" text-anchor="middle" class="s">"Who are you?"</text>
<rect x="435" y="120" width="175" height="150" fill="#fff4dd"/><text x="522" y="148" text-anchor="middle" class="h">2 Token</text><text x="522" y="175" text-anchor="middle" class="s">OAuth 2.0 access</text><text x="522" y="197" text-anchor="middle" class="s">token, audience =</text><text x="522" y="217" text-anchor="middle" class="s">environment URL,</text><text x="522" y="239" text-anchor="middle" class="s">~1 hour lifetime</text>
<rect x="655" y="40" width="285" height="130" fill="#f3e9f7"/><text x="797" y="68" text-anchor="middle" class="h">3 Environment access</text><text x="797" y="95" text-anchor="middle" class="s">enabled user in Entra, licence,</text><text x="797" y="117" text-anchor="middle" class="s">member of environment security</text><text x="797" y="139" text-anchor="middle" class="s">group, systemuser row exists</text>
<rect x="655" y="220" width="285" height="170" fill="#fde8e6"/><text x="797" y="248" text-anchor="middle" class="h">4 Authorization (Dataverse)</text><text x="797" y="275" text-anchor="middle" class="s">security roles: privilege +</text><text x="797" y="297" text-anchor="middle" class="s">access level; business unit,</text><text x="797" y="319" text-anchor="middle" class="s">teams, sharing, column security</text><text x="797" y="347" text-anchor="middle" class="s">"What may you do with</text><text x="797" y="369" text-anchor="middle" class="s">which rows?" (lessons 26–28)</text>
<g stroke="#2d5b7a" stroke-width="2.5" fill="none"><path d="M170 195H212"/><path d="M390 195H432"/><path d="M610 170L652 110"/><path d="M797 170V217"/></g>
<g fill="#2d5b7a"><path d="M212 189l10 6-10 6z"/><path d="M432 189l10 6-10 6z"/><path d="M646 108l10-4-2 11z"/><path d="M791 212l6 10 6-10z"/></g>
<text x="20" y="320" class="s">Fails at 1: sign-in error, MFA prompt</text><text x="20" y="342" class="s">Fails at 3: "You don't have access to this environment"</text><text x="20" y="364" class="s">Fails at 4: privilege error naming a privilege, e.g. prvReadcedar_workorder</text>
</svg>
