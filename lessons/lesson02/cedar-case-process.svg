<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Segoe UI, Arial, sans-serif" font-size="15">
<rect width="1000" height="380" fill="#ffffff"/>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">Urgent fault process (to-be): swimlanes and hand-offs</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44546a"/></marker></defs>
<g stroke="#9aa7b4" fill="none"><rect x="10" y="50" width="980" height="100"/><rect x="10" y="150" width="980" height="100"/><rect x="10" y="250" width="980" height="110"/></g>
<g font-weight="bold" fill="#1b2a3a"><text x="20" y="75">Omar (agent)</text><text x="20" y="175">Sami (field)</text><text x="20" y="275">Lina (manager)</text></g>
<g fill="#e8f1fb" stroke="#2f5d8a" stroke-width="2">
<rect x="150" y="80" width="130" height="55" rx="8"/><rect x="310" y="80" width="130" height="55" rx="8"/>
<rect x="490" y="180" width="140" height="55" rx="8"/><rect x="660" y="180" width="140" height="55" rx="8"/><rect x="830" y="80" width="140" height="55" rx="8"/></g>
<polygon points="400,295 460,270 520,295 460,320" fill="#fff4e0" stroke="#8a5a00" stroke-width="2"/>
<rect x="580" y="275" width="170" height="55" rx="8" fill="#fde8e8" stroke="#a33" stroke-width="2"/>
<g text-anchor="middle" fill="#1b2a3a" font-size="14">
<text x="215" y="103">Log case</text><text x="215" y="122">(call/email)</text>
<text x="375" y="103">Triage priority</text><text x="375" y="122">and assign</text>
<text x="560" y="203">Create work</text><text x="560" y="222">order in FieldLink</text>
<text x="730" y="203">Technician fixes;</text><text x="730" y="222">confirm on site</text>
<text x="900" y="103">Resolve case,</text><text x="900" y="122">notify customer</text>
<text x="460" y="293">Response in</text><text x="460" y="310">4 hours?</text>
<text x="665" y="298">Escalate: reassign,</text><text x="665" y="317">call customer</text></g>
<g stroke="#44546a" stroke-width="2" fill="none" marker-end="url(#a)">
<line x1="280" y1="107" x2="308" y2="107"/><path d="M440,107 L560,107 L560,178"/><line x1="630" y1="207" x2="658" y2="207"/><path d="M800,207 L900,207 L900,137"/>
<path d="M375,135 L375,295 L398,295"/><line x1="520" y1="295" x2="578" y2="300"/></g>
<text x="535" y="288" font-size="13" fill="#a33">No</text>
<text x="160" y="345" font-size="13" fill="#44546a">Timer starts when the case is logged. Diamond = decision. Red = exception path. Arrows crossing lanes = hand-offs.</text>
</svg>
