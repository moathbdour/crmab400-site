<text x="90" y="120">Website enquiry</text><text x="255" y="120">Budget, need, timing</text><text x="420" y="120">Quote accepted</text><text x="585" y="120">Project, work orders</text><text x="750" y="120">Fault cases, SLA</text><text x="915" y="120">Contract renewal</text></g>
<g stroke="#44546a" stroke-width="2" marker-end="url(#a)"><line x1="160" y1="100" x2="183" y2="100"/><line x1="325" y1="100" x2="348" y2="100"/><line x1="490" y1="100" x2="513" y2="100"/><line x1="655" y1="100" x2="678" y2="100"/><line x1="820" y1="100" x2="843" y2="100"/></g>
<path d="M915,142 C915,200 90,200 90,142" fill="none" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="500" y="200" text-anchor="middle" fill="#8a5a00" font-size="14">Loyal customer returns: referrals and new enquiries restart the journey</text>
<text x="20" y="240" font-weight="bold" fill="#1b2a3a">CRM record created or updated at each stage</text>
<g font-size="14" fill="#1b2a3a" text-anchor="middle">
