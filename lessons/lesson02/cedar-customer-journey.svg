<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Segoe UI, Arial, sans-serif" font-size="15">
<rect width="1000" height="420" fill="#ffffff"/>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">Cedar Service customer journey: Harbor View Medical Center</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44546a"/></marker></defs>
<g fill="#e8f1fb" stroke="#2f5d8a" stroke-width="2">
<rect x="20" y="60" width="140" height="80" rx="10"/><rect x="185" y="60" width="140" height="80" rx="10"/><rect x="350" y="60" width="140" height="80" rx="10"/>
<rect x="515" y="60" width="140" height="80" rx="10"/><rect x="680" y="60" width="140" height="80" rx="10"/><rect x="845" y="60" width="140" height="80" rx="10"/></g>
<g text-anchor="middle" fill="#1b2a3a" font-weight="bold">
<text x="90" y="95">1 Attract</text><text x="255" y="95">2 Qualify</text><text x="420" y="95">3 Win</text><text x="585" y="95">4 Deliver</text><text x="750" y="95">5 Serve</text><text x="915" y="95">6 Renew</text></g>
