<text x="90" y="358">Maya</text><text x="255" y="358">Maya</text><text x="420" y="358">Maya</text><text x="585" y="358">Sami</text><text x="750" y="358">Omar, Lina</text><text x="915" y="358">Maya</text></g>
<text x="20" y="400" font-size="14" fill="#44546a">Customer touchpoints: web form, calls, emails, site visits, invoices. Hand-offs between owners are where journeys break.</text>
