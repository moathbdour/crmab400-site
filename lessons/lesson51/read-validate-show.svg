<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-labelledby="t d">
<title id="t">Read, validate, show</title>
<desc id="d">Data flow in C-19 version 3. readSnapshot calls getAttribute and getValue for title, customerid, cedar_site, cedar_casecategory, prioritycode and followupby and normalizes them into a plain object: trimmed strings, choice numbers, the first lookup item with id without braces, and Date objects. validateCase is a pure function taking the snapshot and the current time and returning an issues array of field, id and message. applyIssues sets or clears a control notification per rule and sets the Site required level. OnSave uses the same issues to call preventDefault. Only the pure function needs no form, so Node tests cover it directly.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#1b2733}.h{font-weight:700}.s{font-size:14px;fill:#3b4a58}rect{stroke:#2f5d7c;stroke-width:2}.a{stroke:#2f5d7c;stroke-width:2;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d7c"/></marker></defs>
<rect width="940" height="330" fill="#ffffff" stroke="none"/>
<rect x="20" y="30" width="190" height="170" rx="8" fill="#e8f1f8"/>
<text x="34" y="58" class="h">Case form</text>
<text x="34" y="86" class="s">title (string)</text>
<text x="34" y="106" class="s">customerid (lookup)</text>
<text x="34" y="126" class="s">cedar_site (lookup)</text>
<text x="34" y="146" class="s">cedar_casecategory,</text>
<text x="34" y="166" class="s">prioritycode (choice)</text>
<text x="34" y="186" class="s">followupby (date)</text>
<rect x="250" y="30" width="190" height="170" rx="8" fill="#e8f1f8"/>
<text x="264" y="58" class="h">readSnapshot</text>
<text x="264" y="86" class="s">getAttribute(name)</text>
<text x="264" y="106" class="s">  .getValue()</text>
<text x="264" y="134" class="s">trim, null-safe,</text>
<text x="264" y="154" class="s">lookup[0], GUID</text>
<text x="264" y="174" class="s">without braces</text>
<rect x="480" y="30" width="200" height="170" rx="8" fill="#fdf1dc"/>
<text x="494" y="58" class="h">validateCase</text>
<text x="494" y="86" class="s">(snapshot, now)</text>
<text x="494" y="114" class="s">pure: no Xrm, no DOM</text>
<text x="494" y="142" class="s">returns issues[]</text>
<text x="494" y="162" class="s">{ field, id, message }</text>
<rect x="720" y="30" width="200" height="170" rx="8" fill="#e5f4e8"/>
<text x="734" y="58" class="h">applyIssues</text>
<text x="734" y="86" class="s">setNotification /</text>
<text x="734" y="106" class="s">clearNotification</text>
<text x="734" y="134" class="s">setRequiredLevel on</text>
<text x="734" y="154" class="s">cedar_site</text>
<path class="a" d="M210 115H248"/><path class="a" d="M440 115H478"/><path class="a" d="M680 115H718"/>
<rect x="480" y="230" width="440" height="60" rx="8" fill="#fbe3e3"/>
<text x="494" y="256" class="h">OnSave: same issues → preventDefault()</text>
<text x="494" y="278" class="s">+ ERROR form notification (quiet on autosave)</text>
<path class="a" d="M580 200V228"/>
<text x="20" y="250" class="s">Node tests call validateCase</text>
<text x="20" y="272" class="s">directly with plain objects —</text>
<text x="20" y="294" class="s">no browser, no tenant.</text>
</svg>
