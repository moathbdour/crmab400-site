<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" role="img" aria-labelledby="t d">
<title id="t">Validation layers for a Cedar case</title>
<desc id="d">Four layers from the user outward. 1 Required level: setRequiredLevel makes Site required for a Critical fault; the platform refuses the save while it is empty. 2 Control notification: setNotification on the Title control shows a message next to the field and blocks save until cleared. 3 OnSave check: validateCase runs all rules, preventDefault cancels the save and a form notification lists the problems. 4 Server: CASE-BR1 and later plug-ins enforce rules for imports, flows and APIs that never open the form.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#1b2733}.h{font-weight:700}.s{font-size:14px;fill:#3b4a58}rect{stroke:#2f5d7c;stroke-width:2}.a{stroke:#2f5d7c;stroke-width:2;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d7c"/></marker></defs>
<rect width="940" height="380" fill="#ffffff" stroke="none"/>
<text x="20" y="32" class="h">Omar edits the chiller case — which layer stops a bad value?</text>
<rect x="20" y="60" width="200" height="200" rx="8" fill="#e8f1f8"/>
<text x="34" y="88" class="h">1 Required level</text>
<text x="34" y="116" class="s">setRequiredLevel(</text>
<text x="34" y="136" class="s">  'required')</text>
<text x="34" y="164" class="s">Site required when</text>
<text x="34" y="184" class="s">category = Critical</text>
<text x="34" y="204" class="s">fault. Empty → save</text>
<text x="34" y="224" class="s">refused by platform.</text>
<rect x="250" y="60" width="200" height="200" rx="8" fill="#e8f1f8"/>
<text x="264" y="88" class="h">2 Control message</text>
<text x="264" y="116" class="s">control.setNotification</text>
<text x="264" y="136" class="s">(msg, id) on Title.</text>
<text x="264" y="164" class="s">Shown beside the field;</text>
<text x="264" y="184" class="s">blocks save until</text>
<text x="264" y="204" class="s">clearNotification(id).</text>
<rect x="480" y="60" width="200" height="200" rx="8" fill="#fdf1dc"/>
<text x="494" y="88" class="h">3 OnSave check</text>
<text x="494" y="116" class="s">validateCase(snapshot)</text>
<text x="494" y="136" class="s">runs every rule;</text>
<text x="494" y="164" class="s">preventDefault() +</text>
<text x="494" y="184" class="s">form notification</text>
<text x="494" y="204" class="s">listing the issues.</text>
<rect x="710" y="60" width="210" height="200" rx="8" fill="#e5f4e8"/>
<text x="724" y="88" class="h">4 Server rule</text>
<text x="724" y="116" class="s">CASE-BR1 (Entity scope)</text>
<text x="724" y="136" class="s">and plug-ins (lesson 65)</text>
<text x="724" y="164" class="s">Apply to imports, flows,</text>
<text x="724" y="184" class="s">APIs and other clients</text>
<text x="724" y="204" class="s">that never open the form.</text>
<path class="a" d="M220 160H248"/><path class="a" d="M450 160H478"/><path class="a" d="M680 160H708"/>
<text x="20" y="300" class="s">Layers 1–3 run in Omar's browser: fast feedback, but anyone can bypass them. Layer 4 is enforcement.</text>
<text x="20" y="326" class="s">Rule of thumb: every rule that protects data exists on the server; the form repeats it only to help the user.</text>
<text x="20" y="352" class="s">C-19 v3 uses layers 1–3 in cedar_/case/validation.js; CASE-BR1 stays unchanged.</text>
</svg>
