<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
<title id="t">Execution context flow</title>
<desc id="d">Sequence: Omar opens case, the form loads the web resource library cedar_/case/triage.js, the platform calls cedar.caseTriage.onLoad with executionContext because Pass execution context is checked, the handler calls getFormContext, reads cedar_casecategory and prioritycode, then shows a form notification. Without the checkbox the first argument is undefined and the handler fails.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#1b2733}.h{font-weight:700}.s{font-size:14px;fill:#3b4a58}rect{stroke:#2f5d7c;stroke-width:2}.a{stroke:#2f5d7c;stroke-width:2;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d7c"/></marker></defs>
<rect width="900" height="360" fill="#ffffff" stroke="none"/>
<rect x="15" y="30" width="160" height="90" rx="8" fill="#fdf1dc"/><text x="28" y="60" class="h">1 Omar opens</text><text x="28" y="84" class="s">case “Chiller not</text><text x="28" y="104" class="s">cooling – B”</text>
<path class="a" d="M175 75H200"/>
<rect x="205" y="30" width="160" height="90" rx="8" fill="#e3f0fa"/><text x="218" y="60" class="h">2 Form loads</text><text x="218" y="84" class="s">library cedar_/</text><text x="218" y="104" class="s">case/triage.js</text>
<path class="a" d="M365 75H390"/>
<rect x="395" y="30" width="170" height="90" rx="8" fill="#e3f0fa"/><text x="408" y="60" class="h">3 Platform calls</text><text x="408" y="84" class="s">cedar.caseTriage</text><text x="408" y="104" class="s">.onLoad(ctx)</text>
<path class="a" d="M565 75H590"/>
<rect x="595" y="30" width="140" height="90" rx="8" fill="#eaf6ec"/><text x="608" y="60" class="h">4 Handler</text><text x="608" y="84" class="s">getFormContext</text><text x="608" y="104" class="s">reads columns</text>
<path class="a" d="M735 75H755"/>
<rect x="760" y="30" width="125" height="90" rx="8" fill="#eaf6ec"/><text x="772" y="60" class="h">5 Result</text><text x="772" y="84" class="s">notification</text><text x="772" y="104" class="s">“Urgent…”</text>
<rect x="395" y="180" width="490" height="150" rx="8" fill="#fbe9e9"/><text x="410" y="208" class="h">Pass execution context unchecked</text><text x="410" y="236" class="s">onLoad receives undefined (or only the parameters list)</text><text x="410" y="260" class="s">→ TypeError: cannot read properties of undefined</text><text x="410" y="284" class="s">→ “Script Error” dialog; Omar's form still opens</text><text x="410" y="308" class="s">Fix: check the box in the event handler properties</text>
<path class="a" d="M480 120V175"/>
<text x="20" y="200" class="h">Key rule</text><text x="20" y="226" class="s">Always receive the context as the first</text><text x="20" y="248" class="s">parameter; never rely on Xrm.Page or</text><text x="20" y="270" class="s">window globals to find the form.</text>
</svg>
