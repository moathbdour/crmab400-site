<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t">
<title id="t">Cedar.Dispatch class design: DispatchChecker holds a list of IDispatchRule. The abstract class DispatchRuleBase implements IDispatchRule; AfterHoursAccessRule (DR-01), CostApprovalRule (DR-02) and LeadTimeRule (DR-03) inherit from it. LeadTimeRule uses IClock. Rules read WorkOrder and SiteInfo and return RuleResult.</title>
<defs>
<marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L12 6L0 12z" fill="#ffffff" stroke="#1f3b57"/></marker>
<marker id="use" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f3b57"/></marker>
</defs>
<rect width="960" height="560" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1a1a1a">
<text x="20" y="30" font-weight="700" font-size="17">Cedar.Dispatch — hollow arrow: implements / inherits; solid arrow: uses</text>
<rect x="30" y="60" width="260" height="96" fill="#eef4fa" stroke="#1f3b57"/>
<text x="42" y="84" font-weight="600">DispatchChecker (sealed)</text>
<text x="42" y="108" font-size="14">- _rules: IReadOnlyList&lt;IDispatchRule&gt;</text>
<text x="42" y="128" font-size="14">+ Check(order, site): findings</text>
<text x="42" y="148" font-size="14">+ CanDispatch(order, site): bool</text>
<rect x="380" y="60" width="300" height="96" fill="#fff4dc" stroke="#8a5a00" stroke-dasharray="6 4"/>
<text x="392" y="84" font-weight="600">«interface» IDispatchRule</text>
<text x="392" y="108" font-size="14">+ Id: string</text>
<text x="392" y="128" font-size="14">+ Evaluate(order, site): RuleResult?</text>
<text x="392" y="148" font-size="14">(contract only, no code)</text>
<line x1="290" y1="108" x2="378" y2="108" stroke="#1f3b57" stroke-width="2" marker-end="url(#use)"/>
<text x="296" y="100" font-size="14">0..* rules</text>
<rect x="380" y="210" width="300" height="80" fill="#eef4fa" stroke="#1f3b57"/>
<text x="392" y="234" font-weight="600">DispatchRuleBase (abstract)</text>
<text x="392" y="258" font-size="14"># Result(severity, message)</text>
<text x="392" y="278" font-size="14">+ abstract Evaluate(…)</text>
<line x1="530" y1="210" x2="530" y2="158" stroke="#1f3b57" stroke-width="2" marker-end="url(#inh)"/>
<rect x="60" y="360" width="250" height="70" fill="#eef4fa" stroke="#1f3b57"/>
<text x="72" y="386" font-weight="600">AfterHoursAccessRule</text>
<text x="72" y="410" font-size="14">DR-01: 20:00–07:00 access</text>
<rect x="355" y="360" width="250" height="70" fill="#eef4fa" stroke="#1f3b57"/>
<text x="367" y="386" font-weight="600">CostApprovalRule</text>
<text x="367" y="410" font-size="14">DR-02: limit 5,000 (Lina)</text>
<rect x="650" y="360" width="250" height="70" fill="#eef4fa" stroke="#1f3b57"/>
<text x="662" y="386" font-weight="600">LeadTimeRule (challenge)</text>
<text x="662" y="410" font-size="14">DR-03: FieldLink notice</text>
<line x1="185" y1="360" x2="470" y2="292" stroke="#1f3b57" stroke-width="2" marker-end="url(#inh)"/>
<line x1="480" y1="360" x2="510" y2="292" stroke="#1f3b57" stroke-width="2" marker-end="url(#inh)"/>
<line x1="775" y1="360" x2="590" y2="292" stroke="#1f3b57" stroke-width="2" marker-end="url(#inh)"/>
<rect x="740" y="210" width="190" height="70" fill="#fff4dc" stroke="#8a5a00" stroke-dasharray="6 4"/>
<text x="752" y="236" font-weight="600">«interface» IClock</text>
<text x="752" y="260" font-size="14">+ UtcNow</text>
<line x1="800" y1="360" x2="820" y2="282" stroke="#1f3b57" stroke-width="2" marker-end="url(#use)"/>
<rect x="30" y="470" width="270" height="70" fill="#f1f7ee" stroke="#2f6b2f"/>
<text x="42" y="496" font-weight="600">WorkOrder</text>
<text x="42" y="520" font-size="14">number, site, status, cost, lifecycle</text>
<rect x="340" y="470" width="220" height="70" fill="#f1f7ee" stroke="#2f6b2f"/>
<text x="352" y="496" font-weight="600">SiteInfo</text>
<text x="352" y="520" font-size="14">code, after-hours, notes</text>
<rect x="600" y="470" width="300" height="70" fill="#f1f7ee" stroke="#2f6b2f"/>
<text x="612" y="496" font-weight="600">RuleResult (immutable)</text>
<text x="612" y="520" font-size="14">RuleId, Severity, Message</text>
<text x="30" y="458" font-size="14">Every rule reads WorkOrder and SiteInfo and returns a RuleResult or null.</text>
</g>
</svg>
