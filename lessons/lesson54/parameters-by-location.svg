<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
<title id="t">What PrimaryControl and SelectedControl mean in each location</title>
<desc id="d">On the main form, PrimaryControl is the formContext of the open case and FirstPrimaryItemId is its id. On the main grid, PrimaryControl and SelectedControl are the grid control, and SelectedControlSelectedItemIds is the array of selected case ids. On a subgrid on a form, PrimaryControl is the form's formContext while SelectedControl is the subgrid, with its own selected item ids.</desc>
<rect width="960" height="360" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1b1b1b">
<rect x="20" y="20" width="290" height="320" rx="8" fill="#eef4fb" stroke="#1f5fa8"/>
<text x="34" y="48" font-weight="bold">Main form (Case)</text>
<text x="34" y="80">PrimaryControl</text><text x="54" y="102">= formContext of the case</text>
<text x="34" y="134">FirstPrimaryItemId</text><text x="54" y="156">= case id ({GUID})</text>
<text x="34" y="188">Use for: one record,</text><text x="34" y="210">unsaved values, notifications</text>
<text x="34" y="250" font-style="italic">Cedar: “Check Site now”</text>
<rect x="335" y="20" width="290" height="320" rx="8" fill="#fff7e6" stroke="#b36b00"/>
<text x="349" y="48" font-weight="bold">Main grid (Cases view)</text>
<text x="349" y="80">PrimaryControl / SelectedControl</text><text x="369" y="102">= the grid control</text>
<text x="349" y="134">SelectedControlSelectedItemIds</text><text x="369" y="156">= ["{id1}", "{id2}", …]</text>
<text x="349" y="188">Use for: many records;</text><text x="349" y="210">refresh() the grid afterwards</text>
<text x="349" y="250" font-style="italic">Cedar: “Escalate selected”</text>
<rect x="650" y="20" width="290" height="320" rx="8" fill="#eaf6ee" stroke="#2e7d32"/>
<text x="664" y="48" font-weight="bold">Subgrid on a form</text>
<text x="664" y="80">PrimaryControl</text><text x="684" y="102">= formContext of the parent</text>
<text x="664" y="134">SelectedControl</text><text x="684" y="156">= the subgrid control</text>
<text x="664" y="188">Use for: related rows</text><text x="664" y="210">in context of the parent</text>
<text x="664" y="250" font-style="italic">Cedar: Site form → Cases</text>
<text x="664" y="272" font-style="italic">subgrid (challenge)</text>
</g></svg>
