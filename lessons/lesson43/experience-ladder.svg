<line x1="520" y1="97" x2="558" y2="97"/><line x1="520" y1="151" x2="558" y2="151"/><line x1="520" y1="205" x2="558" y2="205"/><line x1="520" y1="259" x2="558" y2="259"/><line x1="520" y1="313" x2="558" y2="313"/><line x1="520" y1="367" x2="558" y2="367"/><line x1="520" y1="421" x2="558" y2="421"/><line x1="520" y1="475" x2="558" y2="475"/><line x1="520" y1="529" x2="558" y2="529"/>
