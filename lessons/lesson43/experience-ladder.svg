<text x="32" y="102">1 Standard form, view or dashboard is enough?</text><text x="572" y="102">Model-driven app — XP-01 Case intake</text>
<text x="32" y="156">2 Users outside Cedar (no work account)?</text><text x="572" y="156">Power Pages — XP-07 Customer portal</text>
<text x="32" y="210">3 User asks in natural language?</text><text x="572" y="210">Agent: Copilot Studio (XP-08) / Foundry (XP-09)</text>
<text x="32" y="264">4 Interactive UI inside the agent chat?</text><text x="572" y="264">MCP app widget — XP-10 Work order card</text>
<text x="32" y="318">5 Change how an existing form behaves?</text><text x="572" y="318">Business rule / client script — XP-03</text>
<text x="32" y="372">6 Custom rendering of one field or grid, reused?</text><text x="572" y="372">PCF control — XP-04 FieldLink timeline</text>
<text x="32" y="426">7 Whole page in model-driven app, Dataverse data?</text><text x="572" y="426">Generative page — XP-02 Dispatch board</text>
<text x="32" y="480">8 Low-code task app, often phone?</text><text x="572" y="480">Canvas app — XP-06 Site Check</text>
<text x="32" y="534">9 Full custom web app built by developers?</text><text x="572" y="534">Code app — XP-05 Dispatch planner</text>
<text x="20" y="590" fill="#4a4a4a">Supporting: web resources hold script libraries, icons and small static HTML (XP-11 help pane). Legend: green OOB/low-code, purple agents, amber in-app extensions, red pro-code app.</text>
</g>
</svg>
