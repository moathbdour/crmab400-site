<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="t">
<title id="t">Cedar experience ladder. Ask nine questions in order; the first yes decides. 1 standard model-driven form, view or dashboard is enough: model-driven app. 2 external users without Entra work accounts: Power Pages. 3 conversation in natural language: agent, then Copilot Studio or Foundry. 4 rich interactive UI inside an agent chat: MCP app widget. 5 change behaviour of a form: business rule or client script. 6 custom rendering of one field or grid, reused: PCF control. 7 whole page inside a model-driven app on Dataverse: generative page. 8 low-code task app, often mobile: canvas app. 9 full custom web app built by developers: code app. Static files and script libraries: web resource.</title>
<rect width="980" height="620" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a1a1a">
<text x="20" y="30" font-weight="700" font-size="17">Experience ladder: ask from the top, first yes wins</text>
<text x="20" y="62" font-weight="700">Question about the user experience</text><text x="560" y="62" font-weight="700">Experience (Cedar example)</text>
<g stroke="#1f3b57" stroke-width="1.5">
