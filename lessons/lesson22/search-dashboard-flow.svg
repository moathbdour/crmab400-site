<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="t">
<title id="t">From Dataverse rows to search results, views, charts and dashboards</title>
<rect width="980" height="430" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1b1b1b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1b1b1b">
<text x="490" y="30" text-anchor="middle" font-size="20" font-weight="bold">Finding and summarizing Cedar data: search path vs reporting path</text>
<rect x="20" y="170" width="180" height="90" rx="8" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/>
<text x="110" y="200" text-anchor="middle" font-weight="bold">Dataverse rows</text>
<text x="110" y="224" text-anchor="middle">Case, Site, Account,</text>
<text x="110" y="246" text-anchor="middle">Work order</text>
<rect x="250" y="60" width="220" height="90" rx="8" fill="#fff4d6" stroke="#8a5a00"/>
<text x="262" y="86" font-weight="bold">Quick Find view</text>
<text x="262" y="110">Find columns = searched</text>
<text x="262" y="132">View columns = shown/facets</text>
<rect x="510" y="60" width="200" height="90" rx="8" fill="#fff4d6" stroke="#8a5a00"/>
<text x="522" y="86" font-weight="bold">Search index</text>
<text x="522" y="110">Synced, up to ~15 min</text>
<text x="522" y="132">Security trimmed</text>
<rect x="750" y="60" width="210" height="90" rx="8" fill="#e8f3e8" stroke="#2e6b30"/>
<text x="762" y="86" font-weight="bold">Omar searches</text>
<text x="762" y="110">"HV-B chiller" in app</text>
<text x="762" y="132">or searchquery API</text>
<rect x="250" y="280" width="220" height="90" rx="8" fill="#efe6f7" stroke="#5c2d91"/>
<text x="262" y="306" font-weight="bold">View (FetchXML)</text>
<text x="262" y="330">Rows that qualify, live</text>
<text x="262" y="352">no index, no delay</text>
<rect x="510" y="280" width="200" height="90" rx="8" fill="#efe6f7" stroke="#5c2d91"/>
<text x="522" y="306" font-weight="bold">Chart</text>
<text x="522" y="330">Aggregates the view</text>
<text x="522" y="352">(count, sum, group by)</text>
<rect x="750" y="280" width="210" height="90" rx="8" fill="#e8f3e8" stroke="#2e6b30"/>
<text x="762" y="306" font-weight="bold">Dashboard</text>
<text x="762" y="330">Lina: up to 6 charts</text>
<text x="762" y="352">and lists, one page</text>
<line x1="200" y1="195" x2="248" y2="115" stroke="#1b1b1b" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="105" x2="508" y2="105" stroke="#1b1b1b" stroke-width="2" marker-end="url(#a)"/>
<line x1="710" y1="105" x2="748" y2="105" stroke="#1b1b1b" stroke-width="2" marker-end="url(#a)"/>
<line x1="200" y1="235" x2="248" y2="315" stroke="#1b1b1b" stroke-width="2" marker-end="url(#a)"/>
<line x1="470" y1="325" x2="508" y2="325" stroke="#1b1b1b" stroke-width="2" marker-end="url(#a)"/>
<line x1="710" y1="325" x2="748" y2="325" stroke="#1b1b1b" stroke-width="2" marker-end="url(#a)"/>
<text x="340" y="196" font-weight="bold">Search path: "find this one thing"</text>
<text x="340" y="252" font-weight="bold">Reporting path: "how many, by what"</text>
<text x="20" y="410">Both paths respect security roles: a user never sees rows or counts from records they cannot read.</text>
</g>
</svg>
