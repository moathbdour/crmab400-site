<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="t d">
<title id="t">Where Dataverse data meets Work IQ: five surfaces, one intelligence layer, and the direct Dataverse Ask API</title>
<desc id="d">Top row: five ways to reach Work IQ. People use Microsoft 365 Copilot Chat, Cowork, Researcher and Agent Builder. Copilot Studio agents add the Work IQ tool, available only on the GitHub Copilot harness. Foundry agents add the work_iq_preview tool, which forwards the question to Work IQ over A2A on behalf of the user. Coding agents use the Work IQ CLI or the Work IQ MCP server and business skills. Your own code calls the Work IQ API over A2A, REST or MCP, delegated only. All five arrows go down into the Work IQ layer, where every request runs as the signed-in user. Inside it: Microsoft 365 data (mail, meetings, files, chats, people, Planner), Business Applications in Work IQ (preview), which makes Dataverse environments scopes with paths for search, fetch and act, including Dynamics 365 Sales and Customer Service MCP tools and model-driven apps, and billing and governance (Copilot Credits, Work IQ MCP allow or block, spending policies in the Microsoft 365 admin center). An arrow goes from Business Applications down to a Dataverse environment, Cedar-Test with Work IQ on, which holds the semantic model (data scope, signals from relationships, views, forms and descriptions, glossary, regenerated every 12 hours), business skills (Markdown instructions stored as Dataverse rows, solution-aware, shared by role) and Dataverse security (roles, business units, sharing, column security, which trim rows to the caller). On the right, the Dataverse Ask API (preview) at the environment URL plus /api/iq/v1.0 takes a semantic model by name and returns rows, record links and a summary; it accepts delegated or application-user tokens and allows 30 asks per user per minute. Cedar's host C-57 calls it as the person through on-behalf-of. Footer: two routes into the same Dataverse data, through Work IQ's surfaces or directly with the Ask API; both trim rows to the caller.</desc>
