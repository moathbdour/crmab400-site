<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">C-77 contrast pairs: from named options to contrast cards in the C-76 deck</title>
  <desc id="d">Options in the bank name the feature they propose. C-77 counts which feature a learner chose where another was right, writes a contrast card per confused pair and adds those cards, the integrations rule cards and new habit cards to the existing deck.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <style>
    text { font-family: Segoe UI, Arial, sans-serif; fill: #1f2937; }
    .h { font-size: 16px; font-weight: 700; }
    .c { font-size: 14px; }
    .l { font-size: 14px; fill: #374151; font-style: italic; }
  </style>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" class="h" style="font-size:20px">C-77: which two features do you mix up?</text>

  <!-- inputs -->
  <rect x="20" y="50" width="290" height="104" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="32" y="74" class="h">Bank: options name features</text>
  <text x="32" y="98" class="c">IT-21 A policy-template (right)</text>
  <text x="32" y="120" class="c">IT-21 B custom-code</text>
  <text x="32" y="142" class="c">20 of 28 items named</text>
  <rect x="20" y="166" width="290" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="32" y="190" class="h">Glossary (21 features)</text>
  <text x="32" y="214" class="c">name + "choose when" signal</text>
  <text x="32" y="236" class="c">+ lessons to revise</text>
  <rect x="20" y="258" width="290" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="32" y="282" class="h">Karim's drill 2026-12-05</text>
  <text x="32" y="306" class="c">23/28; wrong IT-01, IT-03,</text>
  <text x="32" y="328" class="c">IT-13, IT-21, IT-23</text>

  <!-- analysis -->
  <rect x="350" y="50" width="300" height="288" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="500" y="74" text-anchor="middle" class="h">findConfusions</text>
  <text x="362" y="98" class="c">chose X where Y was right → pair X~Y,</text>
  <text x="362" y="120" class="c">counted once per item</text>
  <text x="362" y="152" class="h">Karim's confused pairs</text>
  <text x="362" y="176" class="c">custom code ~ policy template</text>
  <text x="376" y="198" class="c">2 of 3, both ways (IT-21, IT-23)</text>
  <text x="362" y="222" class="c">Event Hubs ~ topic: 1 of 2 (IT-03)</text>
  <text x="362" y="246" class="c">update-only ~ upsert: 1 of 2, sure</text>
  <text x="362" y="270" class="c">queue ~ webhook: 1 of 3, sure</text>
  <text x="362" y="300" class="l">16 more pairs seen without a fall</text>
  <text x="362" y="322" class="l">(21 chances)</text>
  <line x1="310" y1="102" x2="348" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="310" y1="206" x2="348" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="310" y1="298" x2="348" y2="262" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- deck -->
  <rect x="690" y="50" width="290" height="288" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="835" y="74" text-anchor="middle" class="h">extendState, 2026-12-06</text>
  <text x="702" y="100" class="c">54 existing cards: unchanged</text>
  <text x="702" y="126" class="c">+ 14 rule cards I-01…I-14</text>
  <text x="716" y="148" class="c">(C-76 seeding: 6 in box 1)</text>
  <text x="702" y="174" class="c">+ 2 habit cards: too custom,</text>
  <text x="716" y="196" class="c">wrong detail</text>
  <text x="702" y="222" class="c">+ 4 contrast cards, box 1</text>
  <text x="702" y="256" class="h">74 cards</text>
  <text x="702" y="280" class="c">boxes 13 / 8 / 44 / 9 / 0</text>
  <text x="702" y="304" class="c">forecast to 15 Dec: 108 reviews,</text>
  <text x="702" y="326" class="c">peak 33 on 8 Dec, all ready</text>
  <line x1="650" y1="194" x2="688" y2="194" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- comparison -->
  <rect x="20" y="364" width="470" height="120" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="32" y="388" class="h">What C-75 sees (trap names)</text>
  <text x="32" y="412" class="c">IT-21 B: "works, but too custom", 1 fall</text>
  <text x="32" y="436" class="c">IT-23 B: "legacy or preview", 1 fall</text>
  <text x="32" y="460" class="c">→ two traps, no habit</text>
  <rect x="510" y="364" width="470" height="120" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="522" y="388" class="h">What C-77 sees (features)</text>
  <text x="522" y="412" class="c">custom code and policy template mixed up</text>
  <text x="522" y="436" class="c">in both directions</text>
  <text x="522" y="460" class="c">→ one contrast card: X-custom-code~policy-template</text>

  <text x="500" y="520" text-anchor="middle" class="l">Sessions with contrast cards run through C-77 --due (it needs the glossary); --review and --forecast stay in C-76.</text>
</svg>
