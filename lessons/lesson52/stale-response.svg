<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
<title id="t">Ignoring stale responses</title>
<desc id="d">Omar picks Site HV-B then HV-MAIN quickly. Request 1 returns after request 2; its sequence number is old so it is ignored.</desc>
<rect width="900" height="360" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1b1b1b">
<text x="20" y="30" font-weight="bold">Time →</text>
<line x1="20" y1="60" x2="880" y2="60" stroke="#999" stroke-width="1"/>
<text x="20" y="100" font-weight="bold">Form</text>
<text x="20" y="200" font-weight="bold">Dataverse</text>
<circle cx="150" cy="95" r="8" fill="#1f5fa8"/><text x="165" y="100">Site = HV-B (seq 1)</text>
<circle cx="330" cy="95" r="8" fill="#1f5fa8"/><text x="345" y="100">Site = HV-MAIN (seq 2)</text>
<line x1="150" y1="105" x2="330" y2="195" stroke="#1f5fa8" stroke-width="2" marker-end="url(#a)"/>
<line x1="330" y1="105" x2="480" y2="195" stroke="#2e7d32" stroke-width="2" marker-end="url(#a)"/>
<line x1="500" y1="200" x2="560" y2="130" stroke="#2e7d32" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="150" fill="#2e7d32">reply 2 arrives</text>
<line x1="340" y1="200" x2="720" y2="130" stroke="#b00020" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="600" y="185" fill="#b00020">reply 1 arrives late</text>
<rect x="20" y="240" width="860" height="100" rx="10" fill="#f5f5f5" stroke="#555"/>
<text x="40" y="270">Reply 2: seq 2 === latest → apply result for HV-MAIN.</text>
<text x="40" y="295">Reply 1: seq 1 !== latest (2) → ignore. Without this check HV-B's answer would overwrite HV-MAIN's.</text>
<text x="40" y="320">Also re-read the Site from the form before applying: the user may have cleared it.</text>
</g>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker></defs>
</svg>
