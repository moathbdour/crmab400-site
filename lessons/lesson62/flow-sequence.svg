<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Sequence when Sami requests a FieldLink dispatch from the planner</title>
<desc id="d">Sami presses Request dispatch on WO-1002. The planner calls the generated flow service Run with the work order id. The Power Apps trigger starts the flow, which gets the work order row, checks the environment variable cedar_FieldLinkSyncEnabled, checks the work order is Not sent and has a subcontractor and schedule, adds a note regarding the work order and responds with result queued and a message. If sync is disabled it responds disabled; if the work order is not ready it responds rejected with a reason. The planner shows the message in its status region and refreshes the row.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#1b1b1b}.h{font-weight:700;font-size:16px}.s{font-size:14px;fill:#333}.box{stroke:#1b1b1b;stroke-width:1.5}.l{stroke:#8a8886;stroke-width:1.5;stroke-dasharray:5 4}.a{stroke:#444;stroke-width:1.6;marker-end:url(#m);fill:none}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#444"/></marker></defs>
<rect width="900" height="520" fill="#ffffff"/>
<rect class="box" x="20" y="20" width="170" height="44" rx="6" fill="#deecf9"/><text class="h" x="34" y="48">Sami (planner)</text>
<rect class="box" x="250" y="20" width="200" height="44" rx="6" fill="#deecf9"/><text class="h" x="264" y="48">Generated service</text>
<rect class="box" x="510" y="20" width="170" height="44" rx="6" fill="#fde7e9"/><text class="h" x="524" y="48">Cloud flow</text>
<rect class="box" x="730" y="20" width="150" height="44" rx="6" fill="#dff6dd"/><text class="h" x="744" y="48">Dataverse</text>
<line class="l" x1="105" y1="64" x2="105" y2="500"/>
<line class="l" x1="350" y1="64" x2="350" y2="500"/>
<line class="l" x1="595" y1="64" x2="595" y2="500"/>
<line class="l" x1="805" y1="64" x2="805" y2="500"/>
<line class="a" x1="105" y1="100" x2="348" y2="100"/><text class="s" x="112" y="92">Request dispatch WO-1002</text>
<line class="a" x1="350" y1="140" x2="593" y2="140"/><text class="s" x="358" y="132">Run({ text: id }) – Power Apps trigger</text>
<line class="a" x1="595" y1="180" x2="803" y2="180"/><text class="s" x="602" y="172">Get a row by ID</text>
<line class="a" x1="805" y1="210" x2="597" y2="210"/><text class="s" x="640" y="228">status, subcontractor, time</text>
<rect class="box" x="480" y="244" width="240" height="96" rx="6" fill="#fff4ce"/>
<text class="s" x="492" y="266">sync enabled? (env var)</text>
<text class="s" x="492" y="288">  no → respond "disabled"</text>
<text class="s" x="492" y="310">ready? Not sent + sub + time</text>
<text class="s" x="492" y="332">  no → respond "rejected"</text>
<line class="a" x1="595" y1="370" x2="803" y2="370"/><text class="s" x="602" y="362">Add note (regarding WO)</text>
<line class="a" x1="593" y1="410" x2="352" y2="410"/><text class="s" x="372" y="402">Respond: result "queued", message</text>
<line class="a" x1="348" y1="450" x2="107" y2="450"/><text class="s" x="120" y="442">{ success, data } → status region</text>
<text class="s" x="20" y="490">The app never calls FieldLink directly: secrets and the real call live server-side (C-12, lesson 94).</text>
</svg>
