<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="t">
<title id="t">SLA KPI instance timeline for the urgent first-response KPI in business hours</title>
<rect width="980" height="400" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1b1b1b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1b1b1b">
<text x="490" y="30" text-anchor="middle" font-size="20" font-weight="bold">Urgent first response: warn 3 h, fail 4 h, counted in Cedar business hours</text>
<text x="20" y="66">Case created Monday 15:00 (Priority High, Category Critical fault) → SLA item "Urgent – first response" applies.</text>
<line x1="60" y1="150" x2="940" y2="150" stroke="#1b1b1b" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="120" width="220" height="60" fill="#e8f3e8" stroke="#2e6b30"/>
<text x="70" y="145">Mon 15:00–17:00</text>
<text x="70" y="168">2 h counted</text>
<rect x="280" y="120" width="260" height="60" fill="#eeeeee" stroke="#666666"/>
<text x="290" y="145">17:00–08:00 closed</text>
<text x="290" y="168">clock stops (schedule)</text>
<rect x="540" y="120" width="130" height="60" fill="#fff4d6" stroke="#8a5a00"/>
<text x="548" y="145">Tue 08–09</text>
<text x="548" y="168">3 h → warn</text>
<rect x="670" y="120" width="130" height="60" fill="#fde2e1" stroke="#a4262c"/>
<text x="678" y="145">Tue 09–10</text>
<text x="678" y="168">4 h → fail</text>
<text x="60" y="215" font-weight="bold">SLA KPI instance status</text>
<text x="60" y="240">In Progress → Nearing Noncompliance (Tue 09:00) → Noncompliant (Tue 10:00)</text>
<text x="60" y="262">Succeeded if First Response Sent = Yes before failure time. Paused while status reason = On Hold (if Allow Pause and Resume).</text>
<text x="60" y="302" font-weight="bold">Power Automate SLA action flow (one Switch)</text>
<text x="60" y="326">Is Nearing Non-Compliance → email Omar and the Urgent queue · Is Non-compliant → escalate to Lina (US-05b)</text>
<text x="60" y="348">Is Succeeded → no action</text>
<text x="60" y="385" font-style="italic">Without a customer service schedule the SLA counts 24 × 7: the same case would fail Monday 19:00.</text>
</g>
</svg>
