<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">Where the 6.8 seconds of WO-1207 went</title>
  <desc id="d">Waterfall of one slow Work order save: 1720 ms client, 5120 ms server request, inside it a 4380 ms WorkOrderGuardPlugin step that makes 24 SDK Retrieve calls on cedar_site plus one RetrieveMultiple.</desc>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#1f2937}
    .h{font-size:18px;font-weight:600}
    .s{font-size:14px;fill:#374151}
  </style>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="24" y="34" class="h">One slow save of WO-1207 in Cedar-Test (total 6,840 ms, budget 3,000 ms)</text>
  <!-- time axis -->
  <line x1="200" y1="60" x2="880" y2="60" stroke="#9ca3af"/>
  <text x="196" y="54" class="s">0</text><text x="485" y="54" class="s">3 s budget</text><text x="840" y="54" class="s">6.8 s</text>
  <line x1="498" y1="60" x2="498" y2="440" stroke="#dc2626" stroke-dasharray="6 4"/>
  <!-- rows: scale 0.0994 px per ms -->
  <text x="24" y="100">Page (pageViews)</text>
  <rect x="200" y="82" width="680" height="28" fill="#c7d2fe" stroke="#4338ca"/>
  <text x="210" y="102">6,840 ms seen by Sami</text>

  <text x="24" y="150">Client share</text>
  <rect x="200" y="132" width="171" height="28" fill="#fde68a" stroke="#b45309"/>
  <text x="378" y="152" class="s">1,720 ms: scripts, controls, rendering</text>

  <text x="24" y="200">Server (requests)</text>
  <rect x="371" y="182" width="509" height="28" fill="#bbf7d0" stroke="#15803d"/>
  <text x="381" y="202">5,120 ms Web API Request (Update)</text>

  <text x="24" y="250">Plug-in step</text>
  <rect x="400" y="232" width="435" height="28" fill="#fecaca" stroke="#b91c1c"/>
  <text x="410" y="252">WorkOrderGuardPlugin, stage 20: 4,380 ms</text>

  <text x="24" y="300">SDK calls</text>
  <g fill="#fca5a5" stroke="#991b1b">
    <rect x="404" y="282" width="15" height="28"/><rect x="421" y="282" width="15" height="28"/><rect x="438" y="282" width="15" height="28"/><rect x="455" y="282" width="15" height="28"/><rect x="472" y="282" width="15" height="28"/><rect x="489" y="282" width="15" height="28"/><rect x="506" y="282" width="15" height="28"/><rect x="523" y="282" width="15" height="28"/><rect x="540" y="282" width="15" height="28"/><rect x="557" y="282" width="15" height="28"/><rect x="574" y="282" width="15" height="28"/><rect x="591" y="282" width="15" height="28"/><rect x="608" y="282" width="15" height="28"/><rect x="625" y="282" width="15" height="28"/><rect x="642" y="282" width="15" height="28"/><rect x="659" y="282" width="15" height="28"/><rect x="676" y="282" width="15" height="28"/><rect x="693" y="282" width="15" height="28"/><rect x="710" y="282" width="15" height="28"/><rect x="727" y="282" width="15" height="28"/><rect x="744" y="282" width="15" height="28"/><rect x="761" y="282" width="15" height="28"/><rect x="778" y="282" width="15" height="28"/>
  </g>
  <rect x="795" y="282" width="40" height="28" fill="#e5e7eb" stroke="#374151"/>
  <text x="404" y="330" class="s">24 × SDK Retrieve cedar_site (~160 ms each) = N+1 query inside a loop, then 1 RetrieveMultiple</text>

  <rect x="24" y="356" width="852" height="92" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="40" y="382" class="h">Reading the waterfall</text>
  <text x="40" y="408">1. Subtract the server request from the page time to get the client share (1,720 ms: over its 1,500 ms budget, but not the main cause).</text>
  <text x="40" y="432">2. Inside the request, the plug-in takes 86% of the time; its 25 SDK calls show why. Fix the query first, then re-measure.</text>
</svg>
