<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
  <title id="t">Performance diagnosis path</title>
  <desc id="d">Flow from a symptom report to measurement, then splitting by layer: client, network, Dataverse server, plug-in or flow, external call and data or query, each with the tool to use.</desc>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#111827}
    .b{font-weight:600}
    .s{font-size:14px;fill:#374151}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker></defs>
  <rect width="900" height="420" fill="#fff"/>
  <rect x="20" y="20" width="200" height="70" rx="8" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="34" y="48" class="b">1. Symptom</text><text x="34" y="72" class="s">"Saving WO-1207 is slow"</text>
  <rect x="250" y="20" width="200" height="70" rx="8" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="264" y="48" class="b">2. Reproduce + measure</text><text x="264" y="72" class="s">who, when, which record</text>
  <rect x="480" y="20" width="200" height="70" rx="8" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="494" y="48" class="b">3. Split by layer</text><text x="494" y="72" class="s">page − server = client</text>
  <rect x="710" y="20" width="170" height="70" rx="8" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="724" y="48" class="b">4. Fix one cause</text><text x="724" y="72" class="s">re-measure p75</text>
  <line x1="220" y1="55" x2="248" y2="55" stroke="#374151" marker-end="url(#a)"/>
  <line x1="450" y1="55" x2="478" y2="55" stroke="#374151" marker-end="url(#a)"/>
  <line x1="680" y1="55" x2="708" y2="55" stroke="#374151" marker-end="url(#a)"/>
  <line x1="580" y1="90" x2="580" y2="122" stroke="#374151" marker-end="url(#a)"/>
  <g>
    <rect x="20" y="130" width="280" height="80" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="34" y="156" class="b">Client</text><text x="34" y="178" class="s">Monitor tool, browser DevTools</text><text x="34" y="198" class="s">Performance + Network tabs</text>
    <rect x="310" y="130" width="280" height="80" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="324" y="156" class="b">Network</text><text x="324" y="178" class="s">DevTools timing, request count,</text><text x="324" y="198" class="s">payload size, region distance</text>
    <rect x="600" y="130" width="280" height="80" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="614" y="156" class="b">Dataverse request</text><text x="614" y="178" class="s">App Insights requests table,</text><text x="614" y="198" class="s">x-ms-service-request-id</text>
    <rect x="20" y="230" width="280" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="34" y="256" class="b">Plug-in / flow</text><text x="34" y="278" class="s">dependencies type Plugin, trace log,</text><text x="34" y="298" class="s">flow run duration per action</text>
    <rect x="310" y="230" width="280" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="324" y="256" class="b">External call</text><text x="324" y="278" class="s">dependencies type HTTP, FieldLink</text><text x="324" y="298" class="s">latency; move out of the transaction</text>
    <rect x="600" y="230" width="280" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="614" y="256" class="b">Data / query</text><text x="614" y="278" class="s">SDK RetrieveMultiple duration, $select,</text><text x="614" y="298" class="s">leading wildcards, 429 throttling</text>
  </g>
  <rect x="20" y="335" width="860" height="66" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="34" y="362" class="b">Rule: measure before changing anything, change one thing, measure again with the same percentile and the same data.</text>
  <text x="34" y="386" class="s">Average hides the slow users; compare p75 or p95 for the same page, the same week and the same environment size.</text>
</svg>
