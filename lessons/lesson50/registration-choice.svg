<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="t d">
<title id="t">Choosing a registration approach</title>
<desc id="d">Decision flow: is the event available in the form designer (OnLoad, OnSave, column OnChange, tab change)? If yes and the handler always applies, register it in the designer with Pass execution context ticked. If the event is code-only (Loaded, PreSearch, OnPostSave) or the handler is conditional, register one OnLoad entry point in the designer and add the rest with addOnChange, addPreSearch or addOnPostSave, which pass the execution context automatically. Commands use the command designer instead.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#1b2733}.h{font-weight:700}.s{font-size:14px;fill:#3b4a58}rect{stroke:#2f5d7c;stroke-width:2}.a{stroke:#2f5d7c;stroke-width:2;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d7c"/></marker></defs>
<rect width="920" height="360" fill="#ffffff" stroke="none"/>
<rect x="20" y="130" width="230" height="100" rx="8" fill="#fdf1dc"/><text x="32" y="160" class="h">Event in the form</text><text x="32" y="184" class="h">designer?</text><text x="32" y="210" class="s">OnLoad, OnSave, OnChange</text>
<path class="a" d="M250 160L330 90"/><text x="262" y="112" class="s">yes, always runs</text>
<path class="a" d="M250 200L330 270"/><text x="262" y="262" class="s">no, or conditional</text>
<rect x="335" y="30" width="270" height="110" rx="8" fill="#e3f0fa"/><text x="347" y="58" class="h">Designer registration</text><text x="347" y="82" class="s">Form libraries + Events tab</text><text x="347" y="104" class="s">tick Pass execution context</text><text x="347" y="126" class="s">visible to makers, in form XML</text>
<rect x="335" y="220" width="270" height="110" rx="8" fill="#e6f4e6"/><text x="347" y="248" class="h">Code registration</text><text x="347" y="272" class="s">one designer OnLoad entry,</text><text x="347" y="294" class="s">then addOnChange / addPreSearch</text><text x="347" y="316" class="s">context passed automatically</text>
<path class="a" d="M605 85H660"/><path class="a" d="M605 275H660"/>
<rect x="665" y="30" width="235" height="110" rx="8" fill="#f4f6f8"/><text x="677" y="58" class="h">Cedar C-19</text><text x="677" y="82" class="s">OnLoad: cedar.caseTriage</text><text x="677" y="104" class="s">.onLoad; OnSave:</text><text x="677" y="126" class="s">cedar.caseTriage.onSave</text>
<rect x="665" y="220" width="235" height="110" rx="8" fill="#f4f6f8"/><text x="677" y="248" class="h">Cedar C-19</text><text x="677" y="272" class="s">onLoad adds OnChange on</text><text x="677" y="294" class="s">category + priority and</text><text x="677" y="316" class="s">PreSearch on Site lookup</text>
</svg>
