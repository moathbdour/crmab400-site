<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">Creating a repeat fault case: sequence</title>
  <desc id="d">Omar saves a new fault case; Dataverse runs RepeatFaultPlugin in PreOperation which runs one aggregate FetchXML as SYSTEM, gets 2 prior faults, sets Repeat fault Yes and count 3 on the target; the row is saved, routing places it in a queue, the form reloads and repeat.js shows the warning.</desc>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#111827}
    .b{font-weight:600}
    .s{font-size:14px;fill:#374151}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker></defs>
  <rect width="900" height="470" fill="#fff"/>
  <g class="b">
    <rect x="30" y="20" width="150" height="40" fill="#f3f4f6" stroke="#374151"/><text x="45" y="46">Case form (Omar)</text>
    <rect x="250" y="20" width="150" height="40" fill="#e0e7ff" stroke="#4338ca"/><text x="268" y="46">Dataverse API</text>
    <rect x="470" y="20" width="170" height="40" fill="#fee2e2" stroke="#b91c1c"/><text x="480" y="46">RepeatFaultPlugin</text>
    <rect x="710" y="20" width="160" height="40" fill="#e0e7ff" stroke="#4338ca"/><text x="728" y="46">incident table</text>
  </g>
  <line x1="105" y1="60" x2="105" y2="450" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <line x1="325" y1="60" x2="325" y2="450" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <line x1="555" y1="60" x2="555" y2="450" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <line x1="790" y1="60" x2="790" y2="450" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <line x1="105" y1="95" x2="320" y2="95" stroke="#374151" marker-end="url(#a)"/><text x="115" y="88" class="s">1. POST incident (Fault, site HV-B)</text>
  <rect x="300" y="110" width="510" height="190" fill="none" stroke="#6b7280" stroke-dasharray="6 3"/>
  <text x="560" y="128" class="s">database transaction</text>
  <line x1="325" y1="150" x2="550" y2="150" stroke="#374151" marker-end="url(#a)"/><text x="335" y="143" class="s">2. PreOperation (stage 20)</text>
  <line x1="555" y1="185" x2="785" y2="185" stroke="#374151" marker-end="url(#a)"/><text x="565" y="178" class="s">3. count as SYSTEM (1 query)</text>
  <line x1="785" y1="215" x2="560" y2="215" stroke="#374151" marker-end="url(#a)"/><text x="610" y="232" class="s">faults = 2</text>
  <line x1="550" y1="260" x2="330" y2="260" stroke="#374151" marker-end="url(#a)"/><text x="340" y="252" class="s">4. Target: Repeat = Yes, count 3</text>
  <line x1="325" y1="285" x2="785" y2="285" stroke="#374151" marker-end="url(#a)"/><text x="560" y="278" class="s">5. insert row</text>
  <line x1="325" y1="330" x2="785" y2="330" stroke="#374151" marker-end="url(#a)"/><text x="400" y="323" class="s">6. routing rules see the columns (C-05)</text>
  <line x1="320" y1="370" x2="110" y2="370" stroke="#374151" marker-end="url(#a)"/><text x="130" y="363" class="s">7. 204 / record id</text>
  <rect x="30" y="390" width="400" height="50" fill="#fef3c7" stroke="#b45309"/>
  <text x="42" y="420" class="s">8. form reloads; repeat.js: "Repeat fault: fault 3 at HV-B ..."</text>
</svg>
