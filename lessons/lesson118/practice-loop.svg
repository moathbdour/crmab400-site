<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d">
  <title id="t">C-78 practice assessment: from a timed attempt to ratings, traps, pairs and cards</title>
  <desc id="d">The form PA1 (43 items, three sections, 100 minutes, domains 8, 12, 17 and 6 items inside the study guide ranges) and Karim's timed attempt (answers with confidence, flags, changed answers, Learn lookups, checkpoint times) go into C-78 scoreMock. It reports 39 of 48 points (81%), domain percentages against C-73 readiness (Build 78% against 89%: ratings optimistic), pace +3 minutes at PA-43, and a ready check with four of five checks passed. C-78 then hands the result on: through C-74 to C-73 (14 rating changes, readiness 85 to 90%), to C-75 (habits wrong detail 5 of 44 and wrong place 2 of 15), to C-77 (6 new confused pairs) and to C-76 (9 cards back to box 1, 6 contrast cards added, 82 cards, 9 can't reach box 4 by 15 December). Lesson 119 uses these for remediation labs and the second form PA2, which covers the 45 objectives PA1 didn't test.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <style>
    text { font-family: Segoe UI, Arial, sans-serif; fill: #1f2937; }
    .h { font-size: 16px; font-weight: 700; }
    .c { font-size: 14px; }
  </style>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" class="h" style="font-size:20px">C-78: one timed form, four hand-offs</text>

  <rect x="20" y="52" width="280" height="150" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="32" y="76" class="h">Form PA1 (checkForm)</text>
  <text x="32" y="100" class="c">43 new items, 3 sections, 100 min</text>
  <text x="32" y="122" class="c">Build 8 (18.6%), UX 12 (27.9%)</text>
  <text x="32" y="144" class="c">Extend 17 (39.5%), Integr. 6 (14%)</text>
  <text x="32" y="166" class="c">43 objectives sampled,</text>
  <text x="32" y="188" class="c">45 left for PA2</text>

  <rect x="20" y="218" width="280" height="150" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="32" y="242" class="h">Karim's attempt, 2026-12-08</text>
  <text x="32" y="266" class="c">answers + sure / unsure / guess</text>
  <text x="32" y="288" class="c">8 flagged, 3 changed answers</text>
  <text x="32" y="310" class="c">Learn: PA-14 4 min, PA-19 5 min</text>
  <text x="32" y="332" class="c">checkpoints 18, 44, 63, 71, 84, 99</text>
  <text x="32" y="354" class="c">finished at 100 of 100 minutes</text>

  <line x1="300" y1="127" x2="350" y2="190" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="300" y1="293" x2="350" y2="230" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <rect x="352" y="52" width="300" height="316" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="502" y="76" text-anchor="middle" class="h">scoreMock</text>
  <text x="364" y="102" class="c">34/43 fully right; 39/48 points (81%)</text>
  <text x="364" y="124" class="c">(partial credit: PA-23 gave 1 of 2)</text>
  <text x="364" y="152" class="h">Practice vs C-73 readiness</text>
  <text x="364" y="176" class="c">Build 78% vs 89%: optimistic</text>
  <text x="364" y="198" class="c">UX 79/82, Extend 83/88, Int. 86/79</text>
  <text x="364" y="226" class="h">Ready check (course bar)</text>
  <text x="364" y="250" class="c">points ≥ 80%, domains ≥ 70%,</text>
  <text x="364" y="272" class="c">≤ 3 confident errors, no blanks: pass</text>
  <text x="364" y="294" class="c">pace: +3 min at PA-43: FAIL</text>
  <text x="364" y="322" class="h">Not an exam score</text>
  <text x="364" y="346" class="c">Exam: scaled 1–1,000, 700 to pass</text>

  <line x1="652" y1="110" x2="700" y2="90" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="652" y1="170" x2="700" y2="178" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="652" y1="250" x2="700" y2="268" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="652" y1="320" x2="700" y2="360" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <rect x="702" y="52" width="280" height="76" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="714" y="76" class="h">C-74 → C-73 ratings</text>
  <text x="714" y="98" class="c">14 changes; Learn answers never raise</text>
  <text x="714" y="118" class="c">readiness 85% → 90%</text>

  <rect x="702" y="140" width="280" height="76" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="714" y="164" class="h">C-75 traps</text>
  <text x="714" y="186" class="c">wrong detail 5 of 44 (habit)</text>
  <text x="714" y="206" class="c">wrong place 2 of 15 (habit)</text>

  <rect x="702" y="228" width="280" height="76" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="714" y="252" class="h">C-77 pairs</text>
  <text x="714" y="274" class="c">17 named items, 6 new pairs, e.g.</text>
  <text x="714" y="294" class="c">api-permission ~ security-role</text>

  <rect x="702" y="316" width="280" height="96" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="714" y="340" class="h">C-76 deck (demoteCards)</text>
  <text x="714" y="362" class="c">9 cards to box 1, +6 contrast cards</text>
  <text x="714" y="384" class="c">82 cards; 9 can't reach box 4</text>
  <text x="714" y="404" class="c">by 15 Dec; no cards for B-13, B-17</text>

  <rect x="180" y="440" width="640" height="130" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="500" y="466" text-anchor="middle" class="h">Lesson 119: remediation labs and the second form PA2</text>
  <text x="196" y="492" class="c">Pace: a section-by-section clock plan and a 1-minute flag rule.</text>
  <text x="196" y="516" class="c">Knowledge: labs for the 9 demoted cards and B-13 / B-17 (Build rules).</text>
  <text x="196" y="540" class="c">Calibration: re-rate Build with stricter evidence.</text>
  <text x="196" y="562" class="c">PA2 samples the 45 objectives PA1 didn't test.</text>
  <line x1="842" y1="412" x2="760" y2="440" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
</svg>
