<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">Dynamics 365 apps and Power Platform layers for Cedar Service</title>
  <desc id="d">Layered stack: people at top, Dynamics 365 apps and custom apps in the middle, Power Platform tools, then Dataverse, then Microsoft Entra ID and Azure at the bottom.</desc>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#1b2330}
    .h{font-size:17px;font-weight:700}
    .s{font-size:14px;fill:#3a4658}
  </style>
  <rect width="960" height="560" fill="#ffffff"/>
  <!-- People -->
  <rect x="20" y="16" width="920" height="60" rx="8" fill="#eef3fb" stroke="#5b7bb5"/>
  <text x="36" y="40" class="h">People (personas)</text>
  <text x="36" y="63" class="s">Maya (sales) · Omar, Lina (service) · Sami (field) · Dana (admin) · Karim (developer)</text>
  <!-- Apps -->
  <rect x="20" y="92" width="920" height="120" rx="8" fill="#e8f5ee" stroke="#3c8b5f"/>
  <text x="36" y="116" class="h">Apps users open (model-driven Dynamics 365 apps + custom apps)</text>
  <rect x="36" y="130" width="205" height="68" rx="6" fill="#fff" stroke="#3c8b5f"/>
  <text x="48" y="156">Dynamics 365 Sales</text><text x="48" y="180" class="s">lead, opportunity, quote</text>
  <rect x="256" y="130" width="215" height="68" rx="6" fill="#fff" stroke="#3c8b5f"/>
  <text x="268" y="156">D365 Customer Service</text><text x="268" y="180" class="s">case, queue, SLA</text>
  <rect x="486" y="130" width="205" height="68" rx="6" fill="#fff" stroke="#3c8b5f"/>
  <text x="498" y="156">D365 Field Service</text><text x="498" y="180" class="s">work order, booking</text>
  <rect x="706" y="130" width="218" height="68" rx="6" fill="#fff" stroke="#3c8b5f" stroke-dasharray="6 4"/>
  <text x="718" y="156">Custom Cedar apps</text><text x="718" y="180" class="s">model-driven, canvas, code</text>
  <!-- Power Platform -->
  <rect x="20" y="228" width="920" height="110" rx="8" fill="#f6effa" stroke="#7d4e9e"/>
  <text x="36" y="252" class="h">Power Platform tools (build and extend)</text>
  <text x="36" y="282">Power Apps</text><text x="36" y="304" class="s">apps, forms</text>
  <text x="206" y="282">Power Automate</text><text x="206" y="304" class="s">cloud flows</text>
  <text x="396" y="282">Copilot Studio</text><text x="396" y="304" class="s">agents</text>
  <text x="566" y="282">Power Pages</text><text x="566" y="304" class="s">external sites</text>
  <text x="736" y="282">Power BI</text><text x="736" y="304" class="s">reports</text>
  <!-- Dataverse -->
  <rect x="20" y="354" width="920" height="100" rx="8" fill="#fff6e5" stroke="#b07b12"/>
  <text x="36" y="378" class="h">Microsoft Dataverse (one database per environment)</text>
  <text x="36" y="404">Tables: account, contact, lead, opportunity, incident (case), msdyn_workorder, custom cedar_ tables</text>
  <text x="36" y="430" class="s">Security roles · business rules · plug-ins · Web API · auditing · solutions</text>
  <!-- Foundation -->
  <rect x="20" y="470" width="920" height="72" rx="8" fill="#eceff3" stroke="#5c6778"/>
  <text x="36" y="496" class="h">Microsoft cloud foundation</text>
  <text x="36" y="522" class="s">Microsoft Entra ID (identity) · Azure (Functions, Service Bus, App Insights) · connectors to FieldLink</text>
</svg>
