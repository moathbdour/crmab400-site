<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
<title id="t">Anatomy of ControlManifest.Input.xml</title>
<desc id="d">The control element holds identity attributes; its children are property, type-group, data-set with property-set, feature-usage, external-service-usage and resources. Each child maps to something generated or checked at build and import time.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#1b1b1b}.h{font-weight:700;font-size:17px}.s{font-size:14px;fill:#333}.box{stroke:#1b1b1b;stroke-width:1.5}.a{stroke:#444;stroke-width:1.5;marker-end:url(#m)}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#444"/></marker></defs>
<rect width="900" height="560" fill="#ffffff"/>
<rect class="box" x="20" y="20" width="500" height="520" rx="8" fill="#f3f2f1"/>
<text class="h" x="36" y="48">&lt;manifest&gt; &lt;control …&gt;</text>
<text class="s" x="36" y="70">namespace · constructor · version · control-type</text>
<text class="s" x="36" y="90">display-name-key · description-key</text>
<rect class="box" x="36" y="108" width="468" height="62" rx="6" fill="#deecf9"/>
<text class="h" x="48" y="132">&lt;property&gt; (field values, config)</text>
<text class="s" x="48" y="156">name · of-type | of-type-group · usage · required · default-value</text>
<rect class="box" x="36" y="180" width="468" height="44" rx="6" fill="#deecf9"/>
<text class="h" x="48" y="208">&lt;type-group&gt; list of &lt;type&gt;</text>
<rect class="box" x="36" y="234" width="468" height="74" rx="6" fill="#dff6dd"/>
<text class="h" x="48" y="258">&lt;data-set&gt; (a view or subgrid)</text>
<text class="s" x="48" y="282">  └ &lt;property-set&gt; named column slots</text>
<text class="s" x="48" y="300">cds-data-set-options: command bar, view selector, quick find</text>
<rect class="box" x="36" y="318" width="468" height="44" rx="6" fill="#fff4ce"/>
<text class="h" x="48" y="346">&lt;feature-usage&gt; &lt;uses-feature …/&gt;</text>
<rect class="box" x="36" y="372" width="468" height="44" rx="6" fill="#fff4ce"/>
<text class="h" x="48" y="400">&lt;external-service-usage&gt; &lt;domain/&gt;</text>
<rect class="box" x="36" y="426" width="468" height="96" rx="6" fill="#fde7e9"/>
<text class="h" x="48" y="450">&lt;resources&gt;</text>
<text class="s" x="48" y="474">code (1 only) · css · resx (strings) · img · html</text>
<text class="s" x="48" y="496">platform-library React / Fluent (virtual only)</text>
<text class="s" x="48" y="514">dependency (shared library components)</text>
<rect class="box" x="600" y="100" width="280" height="80" rx="8" fill="#ffffff"/>
<text class="h" x="614" y="128">generated/ManifestTypes.d.ts</text>
<text class="s" x="614" y="152">IInputs: every property + data-set</text>
<text class="s" x="614" y="170">IOutputs: bound + output only</text>
<rect class="box" x="600" y="220" width="280" height="80" rx="8" fill="#ffffff"/>
<text class="h" x="614" y="248">Form / view designer</text>
<text class="s" x="614" y="272">shows labels, filters columns</text>
<text class="s" x="614" y="290">by type, maps property-sets</text>
<rect class="box" x="600" y="340" width="280" height="80" rx="8" fill="#ffffff"/>
<text class="h" x="614" y="368">Runtime context</text>
<text class="s" x="614" y="392">context.device / utils / webAPI</text>
<text class="s" x="614" y="410">only if declared</text>
<rect class="box" x="600" y="440" width="280" height="80" rx="8" fill="#ffffff"/>
<text class="h" x="614" y="468">Bundle and solution</text>
<text class="s" x="614" y="492">bundle.js, css, strings packed</text>
<text class="s" x="614" y="510">under the component in solution</text>
<line class="a" x1="504" y1="140" x2="598" y2="140"/>
<line class="a" x1="504" y1="270" x2="598" y2="260"/>
<line class="a" x1="504" y1="340" x2="598" y2="380"/>
<line class="a" x1="504" y1="474" x2="598" y2="480"/>
</svg>
