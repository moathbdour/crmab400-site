<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">CRMAB400 course map: 15 phases of 8 lessons</title>
  <desc id="desc">Fifteen phases in order, each eight lessons long, colored by what they prepare: CRM and developer foundations, then the four AB-400 domains, production skills and exam preparation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d7f97"/></marker></defs>
