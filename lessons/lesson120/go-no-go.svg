<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
  <title id="t">Go / no-go before the reschedule deadline</title>
  <desc id="d">Decision flow. Run C-80 with the log, by 2026-12-13 20:00. First check G6: is the decision at least 24 hours before the appointment (deadline 2026-12-14 09:00)? If not, sit the exam, because the fee is forfeited anyway, and retake 24 hours later at the earliest if needed. If yes, check the evidence G1 to G4 (ready check, transfer, recall of must-targets, labs): if any fails, reschedule before the deadline. Then logistics G5 (ID, system test, room, phone, sandbox, study guide): if any fails, fix it before the deadline or reschedule. If everything passes, go: light day, warm-up, sit. Karim passes all six checks.</desc>
  <style>
    text { font-family: Segoe UI, Arial, sans-serif; fill: #0b0b0b; }
    .h { font-size: 20px; font-weight: 700; }
    .b { font-size: 16px; font-weight: 700; }
    .t { font-size: 14px; }
    .s { font-size: 14px; fill: #52514e; }
  </style>
  <rect width="1000" height="500" fill="#fcfcfb"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker></defs>
  <text x="20" y="36" class="h">Go / no-go: decide before the reschedule deadline</text>
  <rect x="320" y="60" width="360" height="56" rx="8" fill="#eef3fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="500" y="84" text-anchor="middle" class="b">Run C-80 --brief with the log</text>
  <text x="500" y="104" text-anchor="middle" class="t">decide by 20:00 on 2026-12-13</text>
  <rect x="320" y="150" width="360" height="56" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="500" y="174" text-anchor="middle" class="b">G6: at least 24 h before?</text>
  <text x="500" y="194" text-anchor="middle" class="t">deadline 2026-12-14 09:00</text>
  <rect x="320" y="240" width="360" height="56" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="500" y="264" text-anchor="middle" class="b">G1–G4: evidence ready?</text>
  <text x="500" y="284" text-anchor="middle" class="t">ready check, transfer, recall, labs</text>
  <rect x="320" y="330" width="360" height="56" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="500" y="354" text-anchor="middle" class="b">G5: logistics ready?</text>
  <text x="500" y="374" text-anchor="middle" class="t">ID, system test, room, phone, sandbox, guide</text>
  <rect x="320" y="420" width="360" height="56" rx="8" fill="#e8f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="500" y="444" text-anchor="middle" class="b">GO (Karim: all six pass)</text>
  <text x="500" y="464" text-anchor="middle" class="t">light day, warm-up, sit</text>
  <rect x="740" y="150" width="240" height="76" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="2"/>
  <text x="860" y="174" text-anchor="middle" class="b">SIT</text>
  <text x="860" y="194" text-anchor="middle" class="t">fee is forfeited anyway;</text>
  <text x="860" y="214" text-anchor="middle" class="t">retake 24 h later at the earliest</text>
  <rect x="740" y="240" width="240" height="56" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="2"/>
  <text x="860" y="264" text-anchor="middle" class="b">RESCHEDULE</text>
  <text x="860" y="284" text-anchor="middle" class="t">before the deadline</text>
  <rect x="740" y="330" width="240" height="56" rx="8" fill="#fdf0e8" stroke="#eb6834" stroke-width="2"/>
  <text x="860" y="354" text-anchor="middle" class="b">FIX</text>
  <text x="860" y="374" text-anchor="middle" class="t">before the deadline, or reschedule</text>
  <line x1="500" y1="116" x2="500" y2="148" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="206" x2="500" y2="238" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="510" y="228" class="t">yes</text>
  <line x1="500" y1="296" x2="500" y2="328" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="510" y="318" class="t">yes</text>
  <line x1="500" y1="386" x2="500" y2="418" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="510" y="408" class="t">yes</text>
  <line x1="680" y1="178" x2="738" y2="178" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="694" y="170" class="t">no</text>
  <line x1="680" y1="268" x2="738" y2="268" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="694" y="260" class="t">no</text>
  <line x1="680" y1="358" x2="738" y2="358" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="694" y="350" class="t">no</text>
  <text x="20" y="160" class="s">Microsoft's rule:</text><text x="20" y="180" class="s">reschedule or cancel</text><text x="20" y="200" class="s">≥ 24 h before</text>
  <text x="20" y="250" class="s">Course bar: last form</text><text x="20" y="270" class="s">ready, transfer ≥ 75%,</text><text x="20" y="290" class="s">must-targets recalled</text>
