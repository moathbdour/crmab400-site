<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-labelledby="t d">
  <title id="t">Exam day: check-in window and the pace of the exam clock</title>
  <desc id="d">Exam-day timeline from 07:45 to 11:30 for an online exam at 09:00: system test again at 08:00, check-in window from 08:30 to 09:15, appointment at 09:00, the 100-minute exam clock started by 09:30 at the latest, calendar kept free until 11:15. Below, the 100-minute exam clock: 86 minutes to answer every question, 8 minutes for review and 6 minutes of Learn reserve. Checkpoints: a quarter of the questions by minute 22 (78 left on the clock), half by 43 (57 left), three quarters by 65 (35 left), all by 86 (14 left). Learn minutes push checkpoints later; breaks keep the clock running and close earlier questions.</desc>
  <style>
    text { font-family: Segoe UI, Arial, sans-serif; fill: #0b0b0b; }
    .h { font-size: 20px; font-weight: 700; }
    .b { font-size: 16px; font-weight: 700; }
    .t { font-size: 14px; }
    .s { font-size: 14px; fill: #52514e; }
  </style>
  <rect width="1000" height="510" fill="#fcfcfb"/>
  <text x="60" y="36" class="h">Exam day (online, 09:00): check-in window and exam clock</text>
  <line x1="60" y1="150" x2="940" y2="150" stroke="#0b0b0b" stroke-width="2"/>
  <rect x="236" y="128" width="176" height="44" fill="#e8f6ef" stroke="#1baf7a"/>
  <text x="324" y="120" text-anchor="middle" class="t">check-in window</text>
  <line x1="118.66666666666666" y1="140" x2="118.66666666666666" y2="160" stroke="#0b0b0b" stroke-width="2"/>
  <text x="118.66666666666666" y="92" text-anchor="middle" class="b">08:00</text>
  <text x="118.66666666666666" y="72" text-anchor="middle" class="s">system test again</text>
  <line x1="236" y1="140" x2="236" y2="160" stroke="#0b0b0b" stroke-width="2"/>
  <text x="236" y="192" text-anchor="middle" class="b">08:30</text>
  <text x="236" y="212" text-anchor="middle" class="s">check-in opens</text>
  <line x1="353.3333333333333" y1="140" x2="353.3333333333333" y2="160" stroke="#0b0b0b" stroke-width="2"/>
  <text x="353.3333333333333" y="92" text-anchor="middle" class="b">09:00</text>
  <text x="353.3333333333333" y="72" text-anchor="middle" class="s">appointment</text>
  <line x1="412" y1="140" x2="412" y2="160" stroke="#0b0b0b" stroke-width="2"/>
  <text x="412" y="192" text-anchor="middle" class="b">09:15</text>
  <text x="412" y="212" text-anchor="middle" class="s">check-in closes</text>
  <line x1="470.6666666666667" y1="140" x2="470.6666666666667" y2="160" stroke="#0b0b0b" stroke-width="2"/>
  <text x="470.6666666666667" y="92" text-anchor="middle" class="b">09:30</text>
  <text x="470.6666666666667" y="72" text-anchor="middle" class="s">clock started (latest)</text>
  <line x1="881.3333333333334" y1="140" x2="881.3333333333334" y2="160" stroke="#0b0b0b" stroke-width="2"/>
  <text x="881.3333333333334" y="192" text-anchor="middle" class="b">11:15</text>
  <text x="881.3333333333334" y="212" text-anchor="middle" class="s">calendar free</text>
  <text x="60" y="262" class="b">The 100-minute exam clock (pace plan, any number of questions)</text>
  <rect x="60" y="280" width="756.8" height="44" fill="#eef3fb" stroke="#2a78d6"/>
  <rect x="816.8" y="280" width="70.39999999999998" height="44" fill="#fdf0e8" stroke="#eb6834"/>
  <rect x="887.1999999999999" y="280" width="52.80000000000007" height="44" fill="#e8f6ef" stroke="#1baf7a"/>
  <text x="156.8" y="308" text-anchor="middle" class="t">answering: 86 min</text>
  <line x1="253.6" y1="272" x2="253.6" y2="334" stroke="#2a78d6" stroke-width="3"/>
  <text x="253.6" y="356" text-anchor="middle" class="b">¼ by 22</text>
  <text x="253.6" y="376" text-anchor="middle" class="s">78 min left</text>
  <line x1="438.4" y1="272" x2="438.4" y2="334" stroke="#2a78d6" stroke-width="3"/>
  <text x="438.4" y="356" text-anchor="middle" class="b">½ by 43</text>
  <text x="438.4" y="376" text-anchor="middle" class="s">57 min left</text>
  <line x1="632" y1="272" x2="632" y2="334" stroke="#2a78d6" stroke-width="3"/>
  <text x="632" y="356" text-anchor="middle" class="b">¾ by 65</text>
  <text x="632" y="376" text-anchor="middle" class="s">35 min left</text>
  <line x1="816.8" y1="272" x2="816.8" y2="334" stroke="#2a78d6" stroke-width="3"/>
  <text x="816.8" y="356" text-anchor="middle" class="b">all by 86</text>
  <text x="816.8" y="376" text-anchor="middle" class="s">14 min left</text>
  <text x="852" y="410" text-anchor="middle" class="t">review 8</text>
  <text x="913.6" y="430" text-anchor="middle" class="t">Learn 6</text>
  <text x="60" y="470" class="s">Learn minutes are used when needed and push the checkpoints later by the same amount; the reserve is why you still finish.</text>
  <text x="60" y="492" class="s">Breaks: the clock keeps running and questions seen before a break can't be revisited.</text>
</svg>
