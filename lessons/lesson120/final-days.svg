<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-labelledby="t d">
  <title id="t">Karim's final days: revise, decide, taper, sit</title>
  <desc id="d">Five columns, Friday 11 to Tuesday 15 December 2026. Friday: PA2 at 87% of points, transfer 89%, C-80 brief with 28 targets of which 10 must be recalled. Saturday: a cold card session with 32 due cards, labs R5 and R11, re-checking 11 page dates, system test, sandbox and ID, and 3 extra cards in the evening. Sunday: 26 due cards, labs R10, R12, R9, 14 extra cards, study guide check, and the go or no-go decision at 20:00. Monday: a light day of at most 45 minutes with 19 due cards and no labs; 09:00 is the last moment to reschedule because of the 24-hour rule. Tuesday: a 10-minute warm-up with 3 habit cards, system test at 08:00, check-in from 08:30, exam at 09:00. Bars compare planned minutes with the budget: Saturday 140 of 150, Sunday 150 of 150 after trimming 2 extra cards, Monday 29 of 45, Tuesday 10 of 10.</desc>
