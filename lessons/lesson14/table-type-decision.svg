<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t">
<title id="t">Decision flow for standard, elastic and virtual tables or a connector</title>
<rect width="960" height="620" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1b1b1b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1b1b1b">
<text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold">Where should Cedar Service data live?</text>
<rect x="330" y="52" width="300" height="56" rx="8" fill="#f2f2f2" stroke="#444"/>
<text x="480" y="76" text-anchor="middle" font-weight="bold">Q1. Must Dataverse store the data?</text>
<text x="480" y="97" text-anchor="middle">(or does another system own it?)</text>
<line x1="330" y1="80" x2="190" y2="80" stroke="#1b1b1b" marker-end="url(#a)"/>
<text x="262" y="72" text-anchor="middle">No, keep it there</text>
<rect x="20" y="130" width="330" height="56" rx="8" fill="#f2f2f2" stroke="#444"/>
<line x1="180" y1="80" x2="180" y2="128" stroke="#1b1b1b" marker-end="url(#a)"/>
<text x="185" y="154" text-anchor="middle" font-weight="bold">Q2. Should users see it as rows</text>
<text x="185" y="175" text-anchor="middle">in forms, views and the Web API?</text>
<line x1="100" y1="186" x2="100" y2="240" stroke="#1b1b1b" marker-end="url(#a)"/>
<text x="92" y="218" text-anchor="end">Yes</text>
<line x1="270" y1="186" x2="270" y2="240" stroke="#1b1b1b" marker-end="url(#a)"/>
<text x="278" y="218">No, just actions</text>
<rect x="20" y="242" width="160" height="200" rx="8" fill="#fff4e0" stroke="#a15c00"/>
<text x="100" y="268" text-anchor="middle" font-weight="bold">Virtual table</text>
<text x="100" y="294" text-anchor="middle">Invoice history</text>
<text x="100" y="314" text-anchor="middle">from CedarLedger</text>
<text x="100" y="334" text-anchor="middle">(Azure SQL)</text>
<text x="100" y="362" text-anchor="middle">Read at runtime,</text>
<text x="100" y="382" text-anchor="middle">no copy stored.</text>
<text x="100" y="408" text-anchor="middle">Org-owned, no</text>
<text x="100" y="428" text-anchor="middle">audit or charts</text>
<rect x="195" y="242" width="160" height="200" rx="8" fill="#f3e8fb" stroke="#6b2fa0"/>
<text x="275" y="268" text-anchor="middle" font-weight="bold">Connector</text>
<text x="275" y="294" text-anchor="middle">FieldLink work</text>
<text x="275" y="314" text-anchor="middle">order API</text>
<text x="275" y="334" text-anchor="middle">(REST + OAuth)</text>
<text x="275" y="362" text-anchor="middle">Flows and apps</text>
<text x="275" y="382" text-anchor="middle">call operations.</text>
<text x="275" y="408" text-anchor="middle">Custom connector</text>
<text x="275" y="428" text-anchor="middle">in lesson 94</text>
<line x1="630" y1="80" x2="770" y2="80" stroke="#1b1b1b"/>
<line x1="770" y1="80" x2="770" y2="128" stroke="#1b1b1b" marker-end="url(#a)"/>
<text x="700" y="72" text-anchor="middle">Yes</text>
<rect x="590" y="130" width="360" height="76" rx="8" fill="#f2f2f2" stroke="#444"/>
<text x="770" y="154" text-anchor="middle" font-weight="bold">Q3. Very high volume, flexible schema</text>
<text x="770" y="175" text-anchor="middle">or auto-expiry, and no need for joins,</text>
<text x="770" y="196" text-anchor="middle">transactions, business rules or rollups?</text>
<line x1="680" y1="206" x2="680" y2="240" stroke="#1b1b1b" marker-end="url(#a)"/>
<text x="672" y="228" text-anchor="end">No</text>
<line x1="860" y1="206" x2="860" y2="240" stroke="#1b1b1b" marker-end="url(#a)"/>
<text x="868" y="228">Yes</text>
<rect x="590" y="242" width="175" height="200" rx="8" fill="#e8f1fb" stroke="#1f5fa8"/>
<text x="677" y="268" text-anchor="middle" font-weight="bold">Standard table</text>
<text x="677" y="294" text-anchor="middle">Site, Case,</text>
<text x="677" y="314" text-anchor="middle">Work order, Contract</text>
<text x="677" y="342" text-anchor="middle">Azure SQL backed,</text>
<text x="677" y="362" text-anchor="middle">transactions, joins,</text>
<text x="677" y="382" text-anchor="middle">every feature.</text>
<text x="677" y="410" text-anchor="middle">Database capacity</text>
<text x="677" y="430" text-anchor="middle">The default choice</text>
<rect x="775" y="242" width="175" height="200" rx="8" fill="#e6f5ea" stroke="#1e7b34"/>
<text x="862" y="268" text-anchor="middle" font-weight="bold">Elastic table</text>
<text x="862" y="294" text-anchor="middle">Sensor reading</text>
<text x="862" y="314" text-anchor="middle">(chiller telemetry)</text>
<text x="862" y="342" text-anchor="middle">Azure Cosmos DB,</text>
<text x="862" y="362" text-anchor="middle">partitionid, TTL,</text>
<text x="862" y="382" text-anchor="middle">no multi-row txn.</text>
<text x="862" y="410" text-anchor="middle">Log capacity</text>
<text x="862" y="430" text-anchor="middle">Chosen at creation</text>
<rect x="20" y="470" width="930" height="130" rx="8" fill="#fafafa" stroke="#888"/>
<text x="40" y="498" font-weight="bold">Rules that apply to every branch</text>
<text x="40" y="524">• The table type is fixed when the table is created; an existing table cannot be converted.</text>
<text x="40" y="548">• Mixing is normal: one Cedar solution can hold standard, elastic and virtual tables plus connectors.</text>
<text x="40" y="572">• When in doubt, choose a standard table and revisit with real volume numbers (lesson 42 revisits the decision).</text>
</g>
</svg>
