<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
<title id="t">Releasing and sharing C-23 Cedar Dispatch Planner</title>
<desc id="d">In Cedar-Dev the pipeline codeapp-push builds C-23 and publishes it with pa app push as service principal cedar-ci-dev, which a maker shared the app with once using edit access. CedarServiceCore, containing the code app, flow, agent, environment variable definitions and connection references, is exported and released as a managed solution to Cedar-Test and Cedar-Prod with settings files that supply connection references and environment variable values. In each environment users can run the app only if four gates pass: the app is shared with them (play; individual users, at most 20 in the Cedar CRM group), they have a Power Apps Premium licence, their Dataverse roles allow the data, and data policies allow the connectors.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#1b1b1b}.h{font-weight:700;font-size:16px}.s{font-size:14px;fill:#333}.box{stroke:#1b1b1b;stroke-width:1.5}.a{stroke:#444;stroke-width:1.6;marker-end:url(#m);fill:none}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#444"/></marker></defs>
<rect width="900" height="560" fill="#ffffff"/>
<rect class="box" x="20" y="20" width="260" height="170" rx="8" fill="#deecf9"/>
<text class="h" x="34" y="48">Git main</text>
<text class="s" x="34" y="72">src/codeapps/dispatch-planner</text>
<text class="s" x="34" y="94">power.config.json</text>
<text class="s" x="34" y="116">pipelines/codeapp-push.yml</text>
<text class="s" x="34" y="138">deployment/*.settings.json</text>
<rect class="box" x="320" y="20" width="260" height="170" rx="8" fill="#fff4ce"/>
<text class="h" x="334" y="48">Cedar-Dev</text>
<text class="s" x="334" y="72">npm ci, tests, npm run build</text>
<text class="s" x="334" y="94">pa app push --non-interactive</text>
<text class="s" x="334" y="116">  --solution-id CedarServiceCore</text>
<text class="s" x="334" y="138">as cedar-ci-dev (edit share,</text>
<text class="s" x="334" y="160">  PA_CLI_USE_SP_AUTH)</text>
<rect class="box" x="620" y="20" width="260" height="170" rx="8" fill="#f3f2f1"/>
<text class="h" x="634" y="48">CedarServiceCore</text>
<text class="s" x="634" y="72">code app C-23</text>
<text class="s" x="634" y="94">flow, agent (prototype)</text>
<text class="s" x="634" y="116">env var definitions</text>
<text class="s" x="634" y="138">connection references</text>
<text class="s" x="634" y="160">export → managed (lesson 48)</text>
<line class="a" x1="280" y1="105" x2="318" y2="105"/>
<line class="a" x1="580" y1="105" x2="618" y2="105"/>
<rect class="box" x="320" y="240" width="560" height="110" rx="8" fill="#dff6dd"/>
<text class="h" x="334" y="268">Cedar-Test / Cedar-Prod (managed import)</text>
<text class="s" x="334" y="292">settings file: connection references + env var values</text>
<text class="s" x="334" y="314">Prod through Cedar Release Pipeline (approval, REL-018)</text>
<text class="s" x="334" y="336">never pa app push to Test/Prod</text>
<line class="a" x1="750" y1="190" x2="750" y2="238"/>
<text class="h" x="20" y="400">Can Sami run the app? All four gates must pass</text>
<rect class="box" x="20" y="414" width="200" height="120" rx="8" fill="#deecf9"/>
<text class="h" x="34" y="440">Shared (play)</text>
<text class="s" x="34" y="464">individual users,</text>
<text class="s" x="34" y="486">≤ 20 (GOV-05),</text>
<text class="s" x="34" y="508">no security groups</text>
<rect class="box" x="240" y="414" width="200" height="120" rx="8" fill="#deecf9"/>
<text class="h" x="254" y="440">Licence</text>
<text class="s" x="254" y="464">Power Apps Premium,</text>
