<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Release 2 architecture: repeat faults and arrival notice</title>
  <desc id="d">Omar creates a fault case on the Case form; RepeatFaultPlugin C-65 counts recent fault cases for the site in PreOperation and sets C-64 columns before routing; the form script C-66 shows a warning; work orders for repeat faults go through Service Bus and the outbound function with contract 1.1 seniorTechnician C-67 to FieldLink; FieldLink arrival raises cedar_OnSubcontractorArrived and flow C-69 e-mails the site contact; alerts C-70; view C-68 for Lina.</desc>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#111827}
    .b{font-weight:600}
    .s{font-size:14px;fill:#374151}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker></defs>
  <rect width="900" height="500" fill="#fff"/>
  <rect x="20" y="30" width="170" height="60" rx="8" fill="#f3f4f6" stroke="#374151"/><text x="34" y="56" class="b">Omar: new case</text><text x="34" y="78" class="s">Case form (Cedar)</text>
  <rect x="240" y="30" width="250" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="252" y="56" class="b">C-65 RepeatFaultPlugin</text><text x="252" y="78" class="s">PreOperation Create, counts 30 days</text>
  <rect x="540" y="30" width="170" height="60" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="552" y="56" class="b">C-64 columns</text><text x="552" y="78" class="s">Repeat fault / count</text>
  <rect x="740" y="30" width="140" height="60" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="752" y="56" class="b">C-05 routing</text><text x="752" y="78" class="s">queue + review</text>
  <line x1="190" y1="60" x2="238" y2="60" stroke="#374151" marker-end="url(#a)"/>
  <line x1="490" y1="60" x2="538" y2="60" stroke="#374151" marker-end="url(#a)"/>
  <line x1="710" y1="60" x2="738" y2="60" stroke="#374151" marker-end="url(#a)"/>
  <rect x="20" y="140" width="250" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="32" y="166" class="b">C-66 form warning</text><text x="32" y="188" class="s">"3rd fault at HV-B in 30 days"</text>
  <rect x="320" y="140" width="250" height="60" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="332" y="166" class="b">C-68 view + chart</text><text x="332" y="188" class="s">Lina: repeat faults, 90 days</text>
  <line x1="600" y1="90" x2="160" y2="138" stroke="#374151" marker-end="url(#a)"/>
  <line x1="620" y1="90" x2="450" y2="138" stroke="#374151" marker-end="url(#a)"/>
  <rect x="20" y="260" width="200" height="60" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="32" y="286" class="b">Work order</text><text x="32" y="308" class="s">sent by Sami</text>
  <rect x="270" y="260" width="170" height="60" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="282" y="286" class="b">Service Bus</text><text x="282" y="308" class="s">C-48 topic</text>
  <rect x="490" y="260" width="220" height="60" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="502" y="286" class="b">C-67 outbound 1.1</text><text x="502" y="308" class="s">seniorTechnician true</text>
  <rect x="760" y="260" width="120" height="60" rx="8" fill="#f3f4f6" stroke="#374151"/><text x="772" y="294" class="b">FieldLink</text>
  <line x1="220" y1="290" x2="268" y2="290" stroke="#374151" marker-end="url(#a)"/>
  <line x1="440" y1="290" x2="488" y2="290" stroke="#374151" marker-end="url(#a)"/>
  <line x1="710" y1="290" x2="758" y2="290" stroke="#374151" marker-end="url(#a)"/>
  <rect x="490" y="370" width="220" height="60" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="502" y="396" class="b">C-28 business event</text><text x="502" y="418" class="s">cedar_OnSubcontractorArrived</text>
  <rect x="200" y="370" width="240" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9"/><text x="212" y="396" class="b">C-69 Arrival notice flow</text><text x="212" y="418" class="s">e-mail to site contact</text>
  <line x1="820" y1="320" x2="712" y2="395" stroke="#374151" marker-end="url(#a)"/><text x="770" y="370" class="s">arrived (C-13)</text>
  <line x1="490" y1="400" x2="442" y2="400" stroke="#374151" marker-end="url(#a)"/>
  <rect x="20" y="370" width="150" height="60" rx="8" fill="#fde68a" stroke="#a16207"/><text x="32" y="396" class="b">C-70 alerts</text><text x="32" y="418" class="s">AL-12, AL-13</text>
  <text x="20" y="475" class="s">Red = pro-code, blue = configuration, green = integration, purple = low-code, yellow = governance. Existing components keep their numbers.</text>
</svg>
