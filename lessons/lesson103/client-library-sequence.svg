<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t d">
<title id="t">One conversation through the Copilot Studio client library</title>
<desc id="d">Sequence with four participants: Lina using Cedar's console app C-59, Microsoft Entra ID, the Power Platform API Copilot Studio endpoint, and the published agent Cedar Service Assistant. 1: the app signs Lina in with MSAL for scope https://api.powerplatform.com/.default and receives a delegated token. 2: start_conversation posts to the endpoint and streams back a typing activity and the greeting message, with header x-ms-conversationid. 3: ask_question posts Lina's question with the conversation ID. 4: the agent runs tools as configured and streams typing, message activities and possibly endOfConversation. 5: the app keeps message text and suggested actions, ignores typing and events.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:14px;fill:#1b1b1b}.b{font-weight:700;font-size:15px}.box{stroke:#1b1b1b;stroke-width:1.5}.ln{stroke:#1b1b1b;stroke-width:1.8;fill:none}.lane{stroke:#8a8886;stroke-width:1.2;stroke-dasharray:5 5}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b1b1b"/></marker></defs>
<rect width="1000" height="640" fill="#ffffff"/>
<rect class="box" x="20" y="20" width="200" height="56" rx="8" fill="#deecf9"/><text class="b" x="120" y="44" text-anchor="middle">Lina in C-59 app</text><text x="120" y="64" text-anchor="middle">Python, client library</text>
<rect class="box" x="270" y="20" width="200" height="56" rx="8" fill="#fff4ce"/><text class="b" x="370" y="44" text-anchor="middle">Microsoft Entra ID</text><text x="370" y="64" text-anchor="middle">MSAL public client</text>
<rect class="box" x="520" y="20" width="210" height="56" rx="8" fill="#dff6dd"/><text class="b" x="625" y="44" text-anchor="middle">Power Platform API</text><text x="625" y="64" text-anchor="middle">Copilot Studio endpoint</text>
<rect class="box" x="770" y="20" width="210" height="56" rx="8" fill="#f3e5f5"/><text class="b" x="875" y="44" text-anchor="middle">Published agent</text><text x="875" y="64" text-anchor="middle">cedar_serviceAssistant</text>
<line class="lane" x1="120" y1="76" x2="120" y2="620"/><line class="lane" x1="370" y1="76" x2="370" y2="620"/><line class="lane" x1="625" y1="76" x2="625" y2="620"/><line class="lane" x1="875" y1="76" x2="875" y2="620"/>
<path class="ln" d="M120 115H362" marker-end="url(#a)"/><text x="130" y="106">1 sign in: scope api.powerplatform.com/.default</text>
<path class="ln" d="M370 145H128" marker-end="url(#a)"/><text x="135" y="138">delegated token (scp CopilotStudio.Copilots.Invoke)</text>
<path class="ln" d="M120 200H617" marker-end="url(#a)"/><text x="130" y="192">2 start_conversation (Bearer token, Accept: text/event-stream)</text>
<path class="ln" d="M625 225H867" marker-end="url(#a)"/><text x="635" y="217">Conversation Start topic</text>
<path class="ln" d="M625 260H128" marker-end="url(#a)"/><text x="135" y="252">stream: typing, message "Hello…", x-ms-conversationid</text>
<path class="ln" d="M120 320H617" marker-end="url(#a)"/><text x="130" y="312">3 ask_question("Status of WO-1101?", conversation_id)</text>
<path class="ln" d="M625 345H867" marker-end="url(#a)"/><text x="635" y="337">4 orchestration</text>
<rect class="box" x="770" y="360" width="210" height="76" rx="8" fill="#ffffff"/><text x="875" y="384" text-anchor="middle">tool Work order status</text><text x="875" y="404" text-anchor="middle">(C-43, runs as</text><text x="875" y="424" text-anchor="middle">Cedar Automation)</text>
<path class="ln" d="M867 460H633" marker-end="url(#a)"/><text x="640" y="452">activities</text>
<path class="ln" d="M625 490H128" marker-end="url(#a)"/><text x="135" y="482">stream: typing, message(s), event, maybe endOfConversation</text>
<rect class="box" x="20" y="520" width="440" height="90" rx="8" fill="#deecf9"/><text class="b" x="36" y="545">5 AssistantSession turns the stream into one Turn</text><text x="36" y="568">keeps: message text, suggested actions, attachment types</text><text x="36" y="590">ignores: typing, events · 60 s limit · fixed failure message</text>
</svg>
