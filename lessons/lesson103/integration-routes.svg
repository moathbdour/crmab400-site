<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">Routes from your own application to a Copilot Studio agent</title>
<desc id="d">Decision diagram. Question 1: does the caller have a signed-in person? If no (a daemon or service principal), the client library is not supported; use Direct Line with a secret or token exchange, or a Power Automate flow with the Copilot Studio connector. If yes, question 2: is the caller code you write in .NET, JavaScript or Python? Yes leads to the Copilot Studio client library with the Copilot Studio.Copilots.Invoke delegated permission. If the caller is a low-code app or flow, use the Microsoft Copilot Studio connector. If the caller is another agent, use the A2A or MCP client channels or connected agents from lesson 101. A no-authentication public web page can use the Web Chat embed code.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:14px;fill:#1b1b1b}.b{font-weight:700;font-size:15px}.box{stroke:#1b1b1b;stroke-width:1.5}.ln{stroke:#1b1b1b;stroke-width:1.8;fill:none}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b1b1b"/></marker></defs>
<rect width="1000" height="520" fill="#ffffff"/>
<rect class="box" x="360" y="20" width="280" height="60" rx="8" fill="#fff4ce"/><text class="b" x="500" y="45" text-anchor="middle">1 Is a person signed in?</text><text x="500" y="66" text-anchor="middle">(delegated token possible)</text>
<path class="ln" d="M360 50H230V120" marker-end="url(#a)"/><text x="250" y="42">no: daemon / service</text>
<rect class="box" x="30" y="125" width="400" height="90" rx="8" fill="#fde7e9"/><text class="b" x="230" y="150" text-anchor="middle">Client library not supported</text><text x="230" y="172" text-anchor="middle">(no service principal tokens)</text><text x="230" y="194" text-anchor="middle">Direct Line or a flow with the connector</text>
<path class="ln" d="M640 50H770V120" marker-end="url(#a)"/><text x="660" y="42">yes</text>
<rect class="box" x="570" y="125" width="400" height="60" rx="8" fill="#fff4ce"/><text class="b" x="770" y="150" text-anchor="middle">2 What is the caller?</text><text x="770" y="171" text-anchor="middle">code · low-code · agent · public page</text>
<path class="ln" d="M620 185V270" marker-end="url(#a)"/><path class="ln" d="M720 185V370" marker-end="url(#a)"/><path class="ln" d="M820 185V270" marker-end="url(#a)"/><path class="ln" d="M920 185V370" marker-end="url(#a)"/>
<rect class="box" x="470" y="275" width="230" height="80" rx="8" fill="#dff6dd"/><text class="b" x="585" y="300" text-anchor="middle">Client library</text><text x="585" y="321" text-anchor="middle">.NET · JS · Python</text><text x="585" y="342" text-anchor="middle">Copilots.Invoke</text>
<rect class="box" x="760" y="275" width="230" height="80" rx="8" fill="#deecf9"/><text class="b" x="875" y="300" text-anchor="middle">Agent caller</text><text x="875" y="321" text-anchor="middle">A2A / MCP channel,</text><text x="875" y="342" text-anchor="middle">connected agent (101)</text>
<rect class="box" x="560" y="375" width="230" height="80" rx="8" fill="#deecf9"/><text class="b" x="675" y="400" text-anchor="middle">Low-code caller</text><text x="675" y="421" text-anchor="middle">Copilot Studio connector</text><text x="675" y="442" text-anchor="middle">(code app 63, flows)</text>
<rect class="box" x="810" y="375" width="180" height="80" rx="8" fill="#f3f2f1"/><text class="b" x="900" y="400" text-anchor="middle">Public page</text><text x="900" y="421" text-anchor="middle">Web Chat embed</text><text x="900" y="442" text-anchor="middle">No authentication</text>
<text x="30" y="490">Each route still talks to the published agent; the agent's own authentication and tool identities decide what data it reads.</text>
</svg>
