<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="t d">
<title id="t">Cedar Service integration map: twelve flows, their direction and their transport</title>
<desc id="d">Dataverse in the Cedar environments stands in the middle. On the right is FieldLink, the subcontractor work-order system. Four flows connect them. IN-01, outbound command: a dispatch request leaves Dataverse through a cloud flow triggered by the business event cedar_RequestDispatch and a custom connector, and FieldLink answers with its job ID. IN-02, outbound event: a work order that was rescheduled or cancelled after sending goes to a Service Bus topic with subscriptions for FieldLink and for audit; the first increment is an asynchronous webhook to a function. IN-03, inbound event: FieldLink calls an HTTPS endpoint of Cedar, a function that checks the signature, accepts, queues and lets a worker apply status and arrival. IN-04, inbound file: the nightly status file is applied by the durable function of lesson 88 and serves as the backstop. On the left are Cedar's own consumers. IN-05: every status change goes as a stream to Event Hubs for the live wallboard. IN-06: Rafi's reporting database pulls changes with change tracking. IN-07: a managed link exports tables for long-term analytics. IN-12: a cloud flow tells the case owner that a subcontractor arrived. At the bottom are three flows that never leave or are not copied: IN-08, a credit hold rule enforced by a plug-in step inside the transaction; IN-09, invoice history shown through a virtual table over CedarLedger; IN-10, sensor readings arriving through Event Hubs into an elastic table in release 2; and IN-11, clean site rows upserted by a command-line tool.</desc>
