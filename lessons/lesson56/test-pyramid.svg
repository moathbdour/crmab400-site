<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#1f2933}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#3e4c59}</style>
<text x="20" y="30" class="h">C-19 test layers after lesson 56</text>
<polygon points="300,60 380,60 440,160 240,160" fill="#fde2e1" stroke="#a61b1b" stroke-width="2"/>
<text x="275" y="120">Manual UAT</text>
<polygon points="240,170 440,170 500,270 180,270" fill="#fff4e5" stroke="#b86e00" stroke-width="2"/>
<text x="235" y="225">Integration (e2e, 5)</text>
