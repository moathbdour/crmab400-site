<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t">
<title id="t">CSS box model for the Access status card: margin, border, padding and content, plus a mobile-first layout that becomes two columns at 48em</title>
<rect width="900" height="400" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1a1a1a">
<text x="20" y="30" font-weight="700" font-size="17">Box model: .card</text>
<rect x="20" y="45" width="420" height="330" fill="#fdf3e7" stroke="#8a4b08" stroke-dasharray="6 4"/>
<text x="32" y="68" font-size="14">margin 0 0 1rem (space outside)</text>
<rect x="50" y="80" width="360" height="270" fill="#1f3b57"/>
<text x="62" y="100" font-size="14" fill="#ffffff">border 2px (visible edge)</text>
<rect x="58" y="110" width="344" height="232" fill="#eef4fa"/>
<text x="70" y="132" font-size="14">padding 1rem (space inside)</text>
<rect x="90" y="150" width="280" height="160" fill="#ffffff" stroke="#1f3b57"/>
<text x="105" y="178" font-weight="600">content</text>
<text x="105" y="202" font-size="14">h2 "Access status"</text>
<text x="105" y="226" font-size="14">"Blocked: badge required"</text>
<text x="105" y="250" font-size="14">box-sizing: border-box</text>
<text x="105" y="274" font-size="14">width includes padding+border</text>
<text x="480" y="30" font-weight="700" font-size="17">Responsive layout</text>
<text x="480" y="62" font-size="14">Default (phone, &lt; 48em): one column</text>
<rect x="480" y="75" width="120" height="40" fill="#eef4fa" stroke="#1f3b57"/><text x="492" y="100" font-size="14">Site details</text>
<rect x="480" y="120" width="120" height="40" fill="#eef4fa" stroke="#1f3b57"/><text x="492" y="145" font-size="14">Access status</text>
<rect x="480" y="165" width="120" height="40" fill="#eef4fa" stroke="#1f3b57"/><text x="492" y="190" font-size="14">Report form</text>
<text x="480" y="240" font-size="14">@media (min-width: 48em): grid, 2 columns</text>
<rect x="480" y="255" width="190" height="50" fill="#eef4fa" stroke="#1f3b57"/><text x="492" y="285" font-size="14">Site details</text>
<rect x="680" y="255" width="190" height="50" fill="#eef4fa" stroke="#1f3b57"/><text x="692" y="285" font-size="14">Access status</text>
<rect x="480" y="312" width="390" height="50" fill="#eef4fa" stroke="#1f3b57"/><text x="492" y="342" font-size="14">Report form (spans both columns)</text>
<text x="480" y="388" font-size="14">DOM order never changes, so Tab order stays logical.</text>
</g>
</svg>
