<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <title>Identities used by one Cedar Service Assistant turn</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Who is calling at each hop? (Cedar-Test inventory after review)</text>

  <rect x="20" y="250" width="140" height="70" rx="8" fill="#f1f5f9" stroke="#334155"/>
  <text x="90" y="280" text-anchor="middle" font-weight="bold">Sami / Lina</text>
  <text x="90" y="302" text-anchor="middle">in Test groups</text>

  <rect x="220" y="250" width="170" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="305" y="280" text-anchor="middle" font-weight="bold">C-24 Service</text>
  <text x="305" y="302" text-anchor="middle">Assistant</text>
  <line x1="160" y1="285" x2="218" y2="285" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="189" y="240" text-anchor="middle" font-size="14" fill="#1e3a8a">ID-01</text>
  <text x="189" y="342" text-anchor="middle" font-size="14">delegated</text>

  <!-- branch 1: C-43 -->
  <rect x="470" y="60" width="200" height="70" rx="8" fill="#fef9c3" stroke="#a16207"/>
  <text x="570" y="90" text-anchor="middle" font-weight="bold">C-43 agent flow</text>
  <text x="570" y="112" text-anchor="middle">→ Dataverse</text>
  <line x1="390" y1="265" x2="468" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="680" y="82" font-size="14" fill="#a16207">ID-02 service principal</text>
  <text x="680" y="102" font-size="14" fill="#a16207">Cedar Automation, certificate</text>
  <text x="680" y="122" font-size="14" fill="#a16207">(was: Karim's own connection)</text>

  <!-- branch 2: gateway -->
  <rect x="470" y="160" width="200" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="570" y="195" text-anchor="middle" font-weight="bold">FieldLink Gateway</text>
  <line x1="390" y1="275" x2="468" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="680" y="186" font-size="14" fill="#14532d">ID-03 delegated Sla.Read</text>
  <text x="680" y="206" font-size="14" fill="#14532d">(the person's own permission)</text>

  <!-- branch 3: A2A chain -->
  <rect x="470" y="260" width="200" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="570" y="295" text-anchor="middle" font-weight="bold">C-57 A2A advisor</text>
  <line x1="390" y1="290" x2="468" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="680" y="286" font-size="14" fill="#14532d">ID-04 delegated Dispatch.Read</text>

  <rect x="470" y="370" width="200" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="570" y="398" text-anchor="middle" font-weight="bold">Foundry agent</text>
  <text x="570" y="418" text-anchor="middle">cedar-dispatch-advisor</text>
  <line x1="570" y1="320" x2="570" y2="368" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="580" y="350" font-size="14" fill="#5b21b6">ID-05 managed identity: Foundry Agent Consumer on one agent</text>

  <rect x="470" y="480" width="200" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="570" y="515" text-anchor="middle" font-weight="bold">C-56 MCP server</text>
  <line x1="570" y1="430" x2="570" y2="478" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="460" text-anchor="end" font-size="14" fill="#5b21b6">ID-06 agent identity: Dispatch.Read app role</text>

  <rect x="760" y="480" width="220" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="870" y="507" text-anchor="middle" font-weight="bold">Dataverse Ask API</text>
  <text x="870" y="527" text-anchor="middle">(customer data)</text>
  <path d="M670,410 C740,420 820,440 860,478" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="760" y="575" font-size="14" fill="#7f1d1d">ID-07 on behalf of the person (OBO),</text>
  <text x="760" y="594" font-size="14" fill="#7f1d1d">federated credential, no secret</text>

  <text x="20" y="420" font-size="14" fill="#334155">Not in a user turn:</text>
  <text x="20" y="442" font-size="14" fill="#334155">ID-08 evaluation profile</text>
  <text x="20" y="462" font-size="14" fill="#334155">cedar-eval-tester (delegated)</text>
  <text x="20" y="484" font-size="14" fill="#334155">ID-09 C-59 smoke client</text>
  <text x="20" y="504" font-size="14" fill="#334155">(delegated Copilots.Invoke)</text>
  <text x="20" y="560" font-size="14" fill="#334155">Rule of thumb: customer data → the person's identity;</text>
  <text x="20" y="580" font-size="14" fill="#334155">fixed identities only for narrow, read-only tools.</text>
</svg>
