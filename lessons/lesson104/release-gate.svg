<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <title>Cedar agent release gate C-60</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">C-60 release gate: three kinds of evidence, one decision</text>

  <!-- lane 1 -->
  <rect x="20" y="60" width="560" height="130" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="36" y="84" font-weight="bold" fill="#1e3a8a">1. Evaluation evidence (Copilot Studio)</text>
  <rect x="36" y="98" width="160" height="78" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="116" y="122" text-anchor="middle">Test set</text>
  <text x="116" y="142" text-anchor="middle">20 cases SA-01…20</text>
  <text x="116" y="162" text-anchor="middle">+ catalog (category)</text>
  <rect x="216" y="98" width="170" height="78" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="301" y="122" text-anchor="middle">Run on PUBLISHED</text>
  <text x="301" y="142" text-anchor="middle">agent with profile</text>
  <text x="301" y="162" text-anchor="middle">cedar-eval-tester</text>
  <rect x="406" y="98" width="160" height="78" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="486" y="122" text-anchor="middle">Exported CSV</text>
  <text x="486" y="142" text-anchor="middle">+ run JSON</text>
  <text x="486" y="162" text-anchor="middle">(REST API)</text>
  <line x1="196" y1="137" x2="214" y2="137" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="386" y1="137" x2="404" y2="137" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- lane 2 -->
  <rect x="20" y="205" width="560" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="36" y="229" font-weight="bold" fill="#14532d">2. Permissions review (identity inventory)</text>
  <text x="36" y="255">ID-01…ID-09: every hop, its identity kind, credential,</text>
  <text x="36" y="277">permissions, data scope, write ability, sharing</text>
  <text x="36" y="299" fill="#14532d">Rules PR-1…PR-6 (no secrets in Test/Prod, no maker connections …)</text>

  <!-- lane 3 -->
  <rect x="20" y="330" width="560" height="120" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="36" y="354" font-weight="bold" fill="#7c2d12">3. Human review (people, not the author)</text>
  <text x="36" y="380">Author Karim → reviewer Lina reads transcripts and</text>
  <text x="36" y="402">records a disposition per failed case → approver Dana</text>
  <text x="36" y="424">signs off after the run. Rules HR-1…HR-4</text>

  <!-- gate -->
  <rect x="640" y="180" width="160" height="150" rx="12" fill="#0f172a"/>
  <text x="720" y="225" text-anchor="middle" fill="#fff" font-weight="bold" font-size="18">Gate</text>
  <text x="720" y="252" text-anchor="middle" fill="#fff">EV-1…EV-6</text>
  <text x="720" y="274" text-anchor="middle" fill="#fff">PR-1…PR-6</text>
  <text x="720" y="296" text-anchor="middle" fill="#fff">HR-1…HR-4</text>
  <line x1="580" y1="137" x2="636" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="260" x2="636" y2="258" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="390" x2="636" y2="305" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- outcomes -->
  <rect x="830" y="120" width="155" height="100" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="907" y="148" text-anchor="middle" font-weight="bold" fill="#14532d">PASS (exit 0)</text>
  <text x="907" y="172" text-anchor="middle">Share with the</text>
  <text x="907" y="194" text-anchor="middle">Test groups;</text>
  <text x="907" y="212" text-anchor="middle">promote later</text>
  <rect x="830" y="290" width="155" height="100" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="907" y="318" text-anchor="middle" font-weight="bold" fill="#7f1d1d">FAIL (exit 1)</text>
  <text x="907" y="342" text-anchor="middle">List of problems</text>
  <text x="907" y="364" text-anchor="middle">back to Karim;</text>
  <text x="907" y="384" text-anchor="middle">fix, re-run</text>
  <line x1="800" y1="225" x2="828" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="800" y1="290" x2="828" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <text x="20" y="490" fill="#334155">The gate calls no service: it judges files other steps produced, so it runs the same in a pipeline and on a laptop.</text>
  <text x="20" y="514" fill="#334155">A critical case (safety, injection, refusal, privacy) that fails blocks the release even when the overall pass rate is high.</text>
  <text x="20" y="538" fill="#334155">“Fixed” is proven by a new run, never by a note in the review record.</text>
</svg>
