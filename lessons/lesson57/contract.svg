<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
<title id="t">Component contract</title>
<desc id="d">Manifest declares properties; generated IInputs and IOutputs types; host passes context in, component returns outputs only for bound properties.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;font-size:16px;fill:#1b2733}.b{fill:#e8f1fb;stroke:#2b6cb0;stroke-width:2}.g{fill:#e6f4ea;stroke:#2f855a;stroke-width:2}.h{font-weight:700}.s{font-size:14px}.a{stroke:#1b2733;stroke-width:2;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b2733"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<rect x="20" y="30" width="260" height="150" rx="8" class="g"/><text x="35" y="58" class="h">ControlManifest.Input.xml</text><text x="35" y="86" class="s">status: OptionSet, usage bound</text><text x="35" y="110" class="s">rejectedValue: Whole.None, input</text><text x="35" y="134" class="s">control-type standard</text><text x="35" y="158" class="s">external-service-usage false</text>
<rect x="320" y="30" width="260" height="150" rx="8" class="g"/><text x="335" y="58" class="h">generated/ManifestTypes.d.ts</text><text x="335" y="86" class="s">IInputs: status, rejectedValue</text><text x="335" y="110" class="s">IOutputs: status? only</text><text x="335" y="134" class="s">(regenerated by npm run build)</text>
<rect x="620" y="30" width="260" height="150" rx="8" class="b"/><text x="635" y="58" class="h">index.ts</text><text x="635" y="86" class="s">implements StandardControl</text><text x="635" y="110" class="s">&lt;IInputs, IOutputs&gt;</text><text x="635" y="134" class="s">init, updateView,</text><text x="635" y="158" class="s">getOutputs, destroy</text>
<path d="M280 105H315" class="a"/><path d="M580 105H615" class="a"/>
<rect x="20" y="240" width="380" height="130" rx="8" class="b"/><text x="35" y="268" class="h">IN: context (read-only view)</text><text x="35" y="296" class="s">parameters.status.raw / .attributes.Options</text><text x="35" y="320" class="s">mode.isControlDisabled, updatedProperties</text><text x="35" y="344" class="s">parameters.rejectedValue.raw</text>
<rect x="500" y="240" width="380" height="130" rx="8" class="b"/><text x="515" y="268" class="h">OUT: getOutputs()</text><text x="515" y="296" class="s">{ status: 104570001 } – bound props only</text><text x="515" y="320" class="s">asked for via notifyOutputChanged()</text><text x="515" y="344" class="s">host decides; next updateView is truth</text>
<path d="M210 235V190" class="a"/><path d="M690 185V235" class="a"/>
</svg>
